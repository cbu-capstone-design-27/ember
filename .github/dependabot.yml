# Dependabot configuration.
#
# GitHub Actions, and Cargo for apps/cli. Add package ecosystems (npm, pip, ...)
# per directory once the corresponding app/service has a manifest.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /apps/cli
    schedule:
      interval: weekly
    target-branch: develop
    labels:
      - dependencies
    commit-message:
      prefix: "chore(cli)"
    groups:
      cli:
        patterns:
          - "*"
