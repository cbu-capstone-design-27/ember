# Ember CI
#
# Design:
#   - `ci-ok` is the single required status check. It ALWAYS runs (even when
#     upstream jobs are skipped) and fails only if a job it depends on failed
#     or was cancelled. Mark `ci-ok` as required in branch protection; never
#     mark the individual jobs.
#   - `changes` reports which areas a run touches. Only `web` has a real path
#     filter so far; the other areas still report changed every time. Gate a
#     job on its area's output so unrelated changes skip it (skipped jobs
#     still let `ci-ok` pass).

name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout, which the filter needs on push
      pull-requests: read   # on a PR, the filter lists its files through the API
    outputs:
      web: ${{ steps.paths.outputs.web }}
      cli: ${{ steps.paths.outputs.cli }}
      mcp: ${{ steps.filter.outputs.mcp }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
      packages: ${{ steps.filter.outputs.packages }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      # EMBER-42: the web job and the web image run only when web changed. A PR is
      # compared with its base branch, a push to main or develop with that branch's
      # previous commit (`base` is ignored on PRs). This file counts as a web change,
      # so editing the web job or the image build still runs them. apps/web uses
      # nothing from packages/, so packages/ doesn't count.
      # EMBER-82: likewise the cli job, which also runs when the migrations change,
      # because `ember status` reads the schema they build. It uses nothing from
      # packages/ either.
      - name: Path filter
        id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.ref_name }}
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            cli:
              - 'apps/cli/**'
              - 'infra/k8s/apps/postgres/migrations/**'
              - '.github/workflows/ci.yml'
      # TODO(EMBER-28 follow-up): move each area into the path filter above as its
      # jobs land, e.g.
      #   mcp:      ['apps/mcp/**', 'packages/**']
      #   pipeline: ['services/pipeline/**', 'packages/**']
      #   packages: ['packages/**']
      #   infra:    ['infra/**', '.github/**']
      - name: Stub path filter for the other areas (marked changed)
        id: filter
        run: |
          for area in mcp pipeline packages infra; do
            echo "$area=true" >> "$GITHUB_OUTPUT"
          done

  sanity:
    name: sanity
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      # The Python the service images run (python:3.12-slim). The runner's own python3 follows
      # ubuntu-latest, which moved to 26.04 and Python 3.14 in October 2026.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repo layout present
        run: |
          set -euo pipefail
          for p in apps/web apps/cli apps/mcp services/pipeline services/github-ingestion services/jira-ingestion services/slack-ingestion services/gitlab-ingestion apps/web/package.json apps/web/Dockerfile packages infra docs/adr .github/PULL_REQUEST_TEMPLATE.md .github/CODEOWNERS; do
            test -e "$p" || { echo "missing: $p"; exit 1; }
          done
          echo "layout ok"
      - name: docker-compose is valid YAML
        run: docker compose -f infra/docker-compose.yml config --quiet
      # ADR 0003: Secrets live in Git only as SOPS-encrypted *.sops.yaml files, and those files
      # have to actually be encrypted.
      - name: k8s Secrets are SOPS-encrypted
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            case "$f" in
              *.sops.yaml) ;;
              *) echo "::error file=$f::kind: Secret outside a *.sops.yaml file"; bad=1; continue ;;
            esac
          done < <(grep -rlE '^kind: *Secret *$' infra/k8s || true)
          while IFS= read -r f; do
            grep -qE '^sops:' "$f" || { echo "::error file=$f::not encrypted (run sops -e -i $f)"; bad=1; }
          done < <(find infra/k8s -name '*.sops.yaml')
          exit $bad
      - name: k8s kustomize roots render
        run: |
          set -euo pipefail
          kubectl kustomize infra/k8s/clusters/homelab/flux-system > /dev/null
          kubectl kustomize infra/k8s/infrastructure > /dev/null
          kubectl kustomize infra/k8s/apps > /dev/null
          kubectl kustomize infra/k8s/monitoring > /dev/null
      # EMBER-61: the migrations apply, roll back, and build the schema docs/ingestion/architecture.md
      # defines, on the Postgres version the cluster runs (apps/postgres/cluster.yaml). pgvector's image
      # is that Postgres plus the vector extension, which the cluster image also ships (EMBER-77)
      - name: Postgres migrations match the ingestion doc
        env:
          PGTEST_URL: postgresql://postgres:ci-local@127.0.0.1:55432/postgres?sslmode=disable
          # The dbmate the migrate Job runs (apps/postgres/migrate-job.yaml)
          DBMATE_VERSION: v2.36.0
          DBMATE_SHA256: 47e284b3d8cbad1ba5f090495aa05afd1bbd5f35e2ed5577aad06da74ce780ce
        run: |
          set -euo pipefail
          docker run -d --name pg -e POSTGRES_PASSWORD=ci-local -p 127.0.0.1:55432:5432 pgvector/pgvector:0.8.7-pg18-trixie
          curl -fsSLo "$RUNNER_TEMP/dbmate" "https://github.com/amacneil/dbmate/releases/download/$DBMATE_VERSION/dbmate-linux-amd64"
          echo "$DBMATE_SHA256  $RUNNER_TEMP/dbmate" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/dbmate"
          command -v psql || { sudo apt-get update -q && sudo apt-get install -yq postgresql-client; }
          # The image's first start runs initdb with TCP off, so wait for TCP rather than the socket
          timeout 60 sh -c 'until docker exec pg pg_isready -q -h 127.0.0.1; do sleep 1; done'
          PATH="$RUNNER_TEMP:$PATH" python3 infra/k8s/apps/postgres/test_migrations.py
      - name: nginx reverse-proxy config loads
        run: |
          set -euo pipefail
          out=$(docker run --rm -e NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 \
            -v "$PWD/infra/k8s/apps/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.28-alpine nginx -T)
          grep -F 'location /webhook/ {' <<<"$out"
      - name: Ingestion envelope contract
        run: python3 packages/ingestion-envelope/test_contract.py
      # EMBER-62: on the pg container and dbmate from "Postgres migrations match the ingestion doc"
      - name: Intake against Postgres
        env:
          PGTEST_URL: postgresql://postgres:ci-local@127.0.0.1:55432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          # A venv per service, so each one's pinned requirements stay apart
          python3 -m venv "$RUNNER_TEMP/intake-venv"
          "$RUNNER_TEMP/intake-venv/bin/pip" install -q -r services/intake/requirements.txt
          DBMATE="$RUNNER_TEMP/dbmate" "$RUNNER_TEMP/intake-venv/bin/python3" services/intake/test_intake.py
      # The image the cluster runs: as nobody, refusing to start without its secret, healthy against the pg container
      - name: Intake container
        run: |
          set -euo pipefail
          docker build -f services/intake/Dockerfile -t ember-intake:ci .
          test "$(docker inspect -f '{{.Config.User}}' ember-intake:ci)" = nobody
          # It must exit 2 on its own, not crash or serve; timeout stops a regression that serves forever
          rc=0; out=$(timeout 30 docker run --rm -e DATABASE_URL=postgresql://x@127.0.0.1/x ember-intake:ci 2>&1) || rc=$?
          test "$rc" -eq 2 || { echo "::error::expected exit 2 without GITHUB_WEBHOOK_SECRET, got $rc: $out"; exit 1; }
          grep -F "GITHUB_WEBHOOK_SECRET is required" <<<"$out"
          cid=$(docker run -d --network host -e LISTEN_PORT=18080 -e GITHUB_WEBHOOK_SECRET=ci-local \
            -e DATABASE_URL='postgresql://postgres:ci-local@127.0.0.1:55432/postgres?sslmode=disable' ember-intake:ci)
          trap 'docker logs "$cid"; docker rm -f "$cid" > /dev/null' EXIT
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:18080/health
          echo
      - name: GitHub ingestion local pull contract
        run: python3 services/github-ingestion/test_pull.py
      # EMBER-65: uses the pg container and dbmate the migrations step started and downloaded
      - name: GitHub enrich worker against Postgres
        env:
          PGTEST_URL: postgresql://postgres:ci-local@127.0.0.1:55432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          # A venv per service, so each one's pinned requirements stay apart
          python3 -m venv "$RUNNER_TEMP/github-enrich-venv"
          "$RUNNER_TEMP/github-enrich-venv/bin/pip" install -q -r services/github-ingestion/requirements.txt
          DBMATE="$RUNNER_TEMP/dbmate" "$RUNNER_TEMP/github-enrich-venv/bin/python3" services/github-ingestion/test_enrich.py
      # EMBER-77: on the pg container and dbmate from "Postgres migrations match the ingestion doc"
      - name: Embed worker against Postgres
        env:
          PGTEST_URL: postgresql://postgres:ci-local@127.0.0.1:55432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          # A venv, because the runner's system Python refuses pip installs (PEP 668)
          python3 -m venv "$RUNNER_TEMP/embed-venv"
          "$RUNNER_TEMP/embed-venv/bin/pip" install -q -r services/embed/requirements.txt
          DBMATE="$RUNNER_TEMP/dbmate" "$RUNNER_TEMP/embed-venv/bin/python3" services/embed/test_embed.py
      # EMBER-85: on the pg container and dbmate from "Postgres migrations match the ingestion doc". The
      # writer is in memory here; the graph side runs against Neo4j when NEO4J_TEST_URI is set (README)
      - name: Pipeline loader against Postgres
        working-directory: services/pipeline
        env:
          PGTEST_URL: postgresql://postgres:ci-local@127.0.0.1:55432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          # A venv, because the runner's system Python refuses pip installs (PEP 668)
          python3 -m venv "$RUNNER_TEMP/pipeline-venv"
          "$RUNNER_TEMP/pipeline-venv/bin/pip" install -q -r requirements.txt
          DBMATE="$RUNNER_TEMP/dbmate" "$RUNNER_TEMP/pipeline-venv/bin/python3" -m unittest loader.test_pg_load -v
      - name: Slack ingestion webhook contract
        run: python3 services/slack-ingestion/test_webhook.py
      - name: Slack ingestion local pull contract
        run: python3 services/slack-ingestion/test_pull.py
      - name: Slack ingestion webhook smoke
        env:
          SLACK_SIGNING_SECRET: ci-local-smoke
        run: python3 services/slack-ingestion/smoke_webhook.py
      # EMBER-67: on the pg container and dbmate from "Postgres migrations match the ingestion doc"
      - name: Slack enrich worker
        env:
          PGTEST_URL: postgresql://postgres:ci-local@127.0.0.1:55432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          # A venv per service, so each one's pinned requirements stay apart
          python3 -m venv "$RUNNER_TEMP/slack-enrich-venv"
          "$RUNNER_TEMP/slack-enrich-venv/bin/pip" install -q -r services/slack-ingestion/requirements.txt
          "$RUNNER_TEMP/slack-enrich-venv/bin/python3" services/slack-ingestion/test_enrich.py
          DBMATE="$RUNNER_TEMP/dbmate" "$RUNNER_TEMP/slack-enrich-venv/bin/python3" services/slack-ingestion/test_enrich_db.py
      - name: Jira ingestion webhook contract
        run: python3 services/jira-ingestion/test_webhook.py
      - name: Jira ingestion local pull contract
        run: python3 services/jira-ingestion/test_pull.py
      - name: Jira ingestion webhook smoke
        env:
          JIRA_WEBHOOK_SECRET: ci-local-smoke
        run: python3 services/jira-ingestion/smoke_webhook.py
      # EMBER-66: on the pg container and dbmate from "Postgres migrations match the ingestion doc"
      - name: Jira enrich worker
        env:
          PGTEST_URL: postgresql://postgres:ci-local@127.0.0.1:55432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          # A venv per service, so each one's pinned requirements stay apart
          python3 -m venv "$RUNNER_TEMP/enrich-venv"
          "$RUNNER_TEMP/enrich-venv/bin/pip" install -q -r services/jira-ingestion/requirements.txt
          DBMATE="$RUNNER_TEMP/dbmate" "$RUNNER_TEMP/enrich-venv/bin/python3" services/jira-ingestion/test_enrich.py
      - name: Photon synthetic Slack and Jira fixtures
        run: python3 services/pipeline/fixtures/photon/test_fixtures.py
      - name: GitLab ingestion webhook contract
        run: python3 services/gitlab-ingestion/test_webhook.py
      - name: GitLab ingestion pull contract
        run: python3 services/gitlab-ingestion/test_pull.py
      - name: GitLab ingestion webhook smoke
        env:
          # whsec_ + base64("ci-local-smoke-key"). Throwaway, not a real token.
          GITLAB_WEBHOOK_SIGNING_TOKEN: whsec_Y2ktbG9jYWwtc21va2Uta2V5
        run: python3 services/gitlab-ingestion/smoke_webhook.py
      # EMBER-68: on the pg container and dbmate from "Postgres migrations match the ingestion doc"
      - name: GitLab enrich worker
        env:
          PGTEST_URL: postgresql://postgres:ci-local@127.0.0.1:55432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          # A venv per service, so each one's pinned requirements stay apart
          python3 -m venv "$RUNNER_TEMP/gitlab-enrich-venv"
          "$RUNNER_TEMP/gitlab-enrich-venv/bin/pip" install -q -r services/gitlab-ingestion/requirements.txt
          DBMATE="$RUNNER_TEMP/dbmate" "$RUNNER_TEMP/gitlab-enrich-venv/bin/python3" services/gitlab-ingestion/test_enrich.py
      # EMBER-79: on the pg container and dbmate from "Postgres migrations match the ingestion doc"
      - name: MCP server against Postgres
        env:
          PGTEST_URL: postgresql://postgres:ci-local@127.0.0.1:55432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          # A venv, because the runner's system Python refuses pip installs (PEP 668)
          python3 -m venv "$RUNNER_TEMP/mcp-venv"
          "$RUNNER_TEMP/mcp-venv/bin/pip" install -q -r apps/mcp/requirements.txt -r services/embed/requirements.txt
          DBMATE="$RUNNER_TEMP/dbmate" "$RUNNER_TEMP/mcp-venv/bin/python3" apps/mcp/test_mcp.py
      - name: GitLab ingestion container
        run: |
          set -euo pipefail
          docker build -f services/gitlab-ingestion/Dockerfile -t ember-gitlab-ingestion:ci .
          docker run --rm --entrypoint python3 ember-gitlab-ingestion:ci pull.py --help > /dev/null
          # The cluster runs enrich.py from this image (EMBER-83). Without DATABASE_URL it exits 2 after
          # its imports, so a missing file or library fails here rather than on the cluster.
          status=0
          docker run --rm --entrypoint python3 ember-gitlab-ingestion:ci enrich.py 2> "$RUNNER_TEMP/gitlab-enrich.err" || status=$?
          cat "$RUNNER_TEMP/gitlab-enrich.err"
          test "$status" -eq 2 && grep -q "Set DATABASE_URL" "$RUNNER_TEMP/gitlab-enrich.err"
          cid=$(docker run -d -p 127.0.0.1:18083:8083 ember-gitlab-ingestion:ci)
          trap 'docker logs "$cid"; docker rm -f "$cid" > /dev/null' EXIT
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:18083/health
          echo
          test "$(docker inspect -f '{{.Config.User}}' ember-gitlab-ingestion:ci)" = nobody

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r services/pipeline/requirements.txt
      - name: Graph ontology contract
        run: python services/pipeline/ontology/test_ontology.py
      - name: Pipeline loader unit tests
        working-directory: services/pipeline
        run: python -m unittest discover -s loader -t . -p "test_*.py" -v
      - name: Model client unit tests
        working-directory: services/pipeline
        run: python -m unittest discover -s models -t . -p "test_*.py" -v
      - name: Benchmark unit tests
        working-directory: services/pipeline
        run: python -m unittest discover -s benchmarks -t . -p "test_*.py" -v

  # EMBER-51. The web app: type check, production build, and the sign-up /
  # log-in / log-out tests on SQLite and on a real Postgres (DATABASE_URL swap),
  # the version the cluster runs (EMBER-80).
  web:
    name: web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ember
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d ember"
          --health-interval 2s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Type check
        run: npm run typecheck
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Auth tests (SQLite and Postgres)
        env:
          TEST_POSTGRES_URL: postgres://postgres:ci@localhost:5432/ember
        run: npm test

  # EMBER-82. The CLI (apps/cli, Rust, ADR 0007): format, lint, build, and every test,
  # including `ember status` against the cluster's Postgres version with the repo
  # migrations applied by the dbmate the migrate Job runs. pgvector's image, as in
  # sanity, because the migrations create the vector extension (EMBER-77).
  cli:
    name: cli
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_PASSWORD: ci-local
        ports:
          - 5432:5432
        # TCP, not the socket: the first start runs initdb on a socket-only server
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/cli
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      # The version, rustfmt and clippy come from apps/cli/rust-toolchain.toml
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/cli
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: dbmate
        env:
          # As in sanity: the dbmate the migrate Job runs (apps/postgres/migrate-job.yaml)
          DBMATE_VERSION: v2.36.0
          DBMATE_SHA256: 47e284b3d8cbad1ba5f090495aa05afd1bbd5f35e2ed5577aad06da74ce780ce
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/dbmate" "https://github.com/amacneil/dbmate/releases/download/$DBMATE_VERSION/dbmate-linux-amd64"
          echo "$DBMATE_SHA256  $RUNNER_TEMP/dbmate" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/dbmate"
      - name: Tests, including those that need Postgres
        env:
          PGTEST_URL: postgresql://postgres:ci-local@localhost:5432/postgres?sslmode=disable
        run: DBMATE="$RUNNER_TEMP/dbmate" cargo test --locked -- --include-ignored

  # EMBER-42. Every services/<name>/Dockerfile and apps/<name>/Dockerfile is an
  # image target named <name>. Adding a Dockerfile is all it takes to enroll a
  # service; see docs/container-images.md. The web image is left out when
  # `changes` says web didn't change.
  image-targets:
    name: image targets
    runs-on: ubuntu-latest
    needs: changes
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Find Dockerfiles
        id: find
        env:
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os
          dirs = sorted(os.path.dirname(p) for p in glob.glob("services/*/Dockerfile") + glob.glob("apps/*/Dockerfile"))
          names = [os.path.basename(d) for d in dirs]
          dupes = sorted({n for n in names if names.count(n) > 1})
          if dupes:
              raise SystemExit(f"image name collision between services/ and apps/: {dupes}")
          targets = [{"name": n, "dir": d} for n, d in zip(names, dirs)
                     if d != "apps/web" or os.environ["WEB_CHANGED"] == "true"]
          print("matrix=" + json.dumps(targets))
          EOF
          cat "$GITHUB_OUTPUT"

  # Builds each target for amd64 (hv-workers) and arm64 (pi-cp) on every run.
  # A push to main or develop logs in to GHCR and publishes; each branch gets
  # its own tags so the two can be deployed to separate environments.
  images:
    name: image (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    needs: image-targets
    if: needs.image-targets.outputs.matrix != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.image-targets.outputs.matrix) }}
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target.name }}
          # main:    main, main-<sha>, main-<run>-<sha>, latest
          # develop: develop, develop-<sha>, develop-<run>-<sha>
          # PRs:     pr-<n> (built, never pushed)
          # <run> is the workflow run number. It only goes up, so Flux's ImagePolicy can sort
          # <branch>-<run>-<sha> to find the newest build; <branch>-<sha> has no order.
          tags: |
            type=ref,event=branch
            type=sha,prefix=${{ github.ref_name }}-,enable=${{ env.PUBLISH == 'true' }}
            type=sha,prefix=${{ github.ref_name }}-${{ github.run_number }}-,enable=${{ env.PUBLISH == 'true' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
      - name: Build${{ env.PUBLISH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.target.dir }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}

  # Placeholder for future per-area jobs. Gate each on the matching `changes`
  # output, e.g.:
  #
  #   web:
  #     needs: changes
  #     if: needs.changes.outputs.web == 'true'
  #     ...
  #
  # and add the job name to `ci-ok.needs`.

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - sanity
      - pipeline
      - web
      - cli
      - image-targets
      - images
    steps:
      - name: Evaluate upstream job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::one or more upstream jobs failed or were cancelled"
            exit 1
          fi
          echo "ci-ok"
