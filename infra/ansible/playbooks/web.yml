---
# The web app on the cluster (k8s/apps/web, EMBER-112).
# secret: writes k8s/apps/web/auth.sops.yaml, Secret web-auth, from vault_web_better_auth_secret,
#   encrypted with the public key in .sops.yaml. Commit the file it writes. Use make web-secret.
#   With vault_web_github_client_id and vault_web_github_client_secret (the ember-ingest App's OAuth
#   client, EMBER-130), it holds those too, and Settings offers Connect GitHub. With
#   vault_jira_oauth_client_id and vault_jira_oauth_client_secret (the Atlassian 3LO app, EMBER-131),
#   it holds those too, and Settings offers Connect Jira. With vault_slack_client_id and
#   vault_slack_client_secret (the Slack app's OAuth client, EMBER-148), it holds those too, and
#   Settings offers Connect Slack.
# test-accounts: creates the test accounts (files/web_test_accounts.py) on the deployed app, with the
#   password in vault_web_test_password, or checks they are there. Use make web-test-accounts.
# serve: on each node, `tailscale serve` answers https://<node>.<tailnet_domain> with a certificate
#   Tailscale issues and renews, and proxies to web-local on 127.0.0.1:3001 (k8s/apps/web/local-proxy.yaml).
#   It is host config, which Flux can't apply, so run it after a node is rebuilt. Use make web-serve.
#   To undo it on a node: sudo tailscale serve reset.
# The values are never printed.
- name: Web
  hosts: localhost
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir }}/../../.."
    secret_file: infra/k8s/apps/web/auth.sops.yaml
    # pi-cp's address, which anyone who can reach the nodes can use (the serve play below)
    web_url: "https://pi-cp.{{ tailnet_domain }}"
    web_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: web-auth
        namespace: ember
      stringData: >-
        {{ web_auth
           | combine(web_github if vault_web_github_client_id is defined else {})
           | combine(web_jira if vault_jira_oauth_client_id is defined else {})
           | combine(web_slack if vault_slack_client_id is defined else {}) }}
    web_auth:
      BETTER_AUTH_SECRET: "{{ vault_web_better_auth_secret | default('') }}"
    web_github:
      GITHUB_APP_CLIENT_ID: "{{ vault_web_github_client_id | default('') }}"
      GITHUB_APP_CLIENT_SECRET: "{{ vault_web_github_client_secret | default('') }}"
    web_jira:
      JIRA_OAUTH_CLIENT_ID: "{{ vault_jira_oauth_client_id | default('') }}"
      JIRA_OAUTH_CLIENT_SECRET: "{{ vault_jira_oauth_client_secret | default('') }}"
    web_slack:
      SLACK_CLIENT_ID: "{{ vault_slack_client_id | default('') }}"
      SLACK_CLIENT_SECRET: "{{ vault_slack_client_secret | default('') }}"
  tasks:
    - name: Secret
      tags: [secret]
      block:
        - name: Require the Better Auth secret in the vault
          ansible.builtin.assert:
            that:
              - vault_web_better_auth_secret is defined
              - vault_web_better_auth_secret is string
              - vault_web_better_auth_secret | length >= 32
              - vault_web_better_auth_secret == vault_web_better_auth_secret | trim
            fail_msg: >-
              Add vault_web_better_auth_secret (openssl rand -hex 32) with
              .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        - name: Require both halves of the GitHub App's OAuth client, or neither
          ansible.builtin.assert:
            that:
              - (vault_web_github_client_id is defined) == (vault_web_github_client_secret is defined)
              - vault_web_github_client_id is not defined or (vault_web_github_client_id | length > 0 and vault_web_github_client_secret | length > 0)
            fail_msg: >-
              Set both vault_web_github_client_id and vault_web_github_client_secret (the ember-ingest App's
              Client ID and a client secret from its settings page) with
              .venv/bin/ansible-vault edit group_vars/all/vault.yml, or neither
            quiet: true
          no_log: true

        - name: Require both halves of the Atlassian app's OAuth client, or neither
          ansible.builtin.assert:
            that:
              - (vault_jira_oauth_client_id is defined) == (vault_jira_oauth_client_secret is defined)
              - >-
                vault_jira_oauth_client_id is not defined or
                (vault_jira_oauth_client_id | length > 0 and vault_jira_oauth_client_secret | length > 0
                 and vault_jira_oauth_client_id == vault_jira_oauth_client_id | trim
                 and vault_jira_oauth_client_secret == vault_jira_oauth_client_secret | trim)
            fail_msg: >-
              Set both vault_jira_oauth_client_id and vault_jira_oauth_client_secret (the Atlassian 3LO app's
              Client ID and Secret, from its Settings page in the developer console), without spaces around
              them, with .venv/bin/ansible-vault edit group_vars/all/vault.yml, or neither
            quiet: true
          no_log: true

        - name: Require both halves of the Slack app's OAuth client, or neither
          ansible.builtin.assert:
            that:
              - (vault_slack_client_id is defined) == (vault_slack_client_secret is defined)
              - >-
                vault_slack_client_id is not defined or
                (vault_slack_client_id | length > 0 and vault_slack_client_secret | length > 0
                 and vault_slack_client_id == vault_slack_client_id | trim
                 and vault_slack_client_secret == vault_slack_client_secret | trim)
            fail_msg: >-
              Set both vault_slack_client_id and vault_slack_client_secret (the Slack app's Client ID and
              Client Secret, from Basic Information -> App Credentials), without spaces around them, with
              .venv/bin/ansible-vault edit group_vars/all/vault.yml, or neither
            quiet: true
          no_log: true

        # Encrypting again gives new ciphertext every time, so only write when the value changed
        - name: Read the secret the file holds now
          ansible.builtin.command:
            argv: [sops, --decrypt, --extract, '["stringData"]', --output-type, json, "{{ secret_file }}"]
            chdir: "{{ repo_dir }}"
          environment:
            SOPS_AGE_KEY: "{{ vault_sops_age_key | default('') }}"
          register: current
          changed_when: false
          failed_when: false
          no_log: true

        - name: Encrypt the Secret
          ansible.builtin.command:
            argv: [sops, --encrypt, --filename-override, "{{ secret_file }}",
                   --input-type, json, --output-type, yaml, /dev/stdin]
            chdir: "{{ repo_dir }}"
            stdin: "{{ web_secret | to_json }}"
          register: encrypted
          when: current.rc != 0 or (current.stdout | from_json) != web_secret.stringData
          changed_when: false
          no_log: true

        - name: Write it to {{ secret_file }}
          ansible.builtin.copy:
            content: "{{ encrypted.stdout }}\n"
            dest: "{{ repo_dir }}/{{ secret_file }}"
            mode: "0644"
          when: encrypted is not skipped

        - name: Say what to do next
          ansible.builtin.debug:
            msg: >-
              {{ secret_file ~ ' is written. Commit and merge it, then restart the web app: kubectl --context homelab -n ember rollout restart deploy/web. If BETTER_AUTH_SECRET changed, everyone is signed out, the CLI included'
                 if encrypted is not skipped else secret_file ~ ' already holds the vault value; nothing to do' }}

    - name: Test accounts
      tags: [test-accounts]
      block:
        - name: Require the test accounts' password in the vault
          ansible.builtin.assert:
            that:
              - vault_web_test_password is defined
              - vault_web_test_password is string
              - vault_web_test_password | length >= 8
            fail_msg: >-
              Add vault_web_test_password (at least 8 characters; openssl rand -base64 18) with
              .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        # The password goes through the environment, never the command line
        - name: Create the test accounts, or check they are there
          ansible.builtin.command:
            argv: ["{{ ansible_playbook_python }}", "{{ playbook_dir }}/files/web_test_accounts.py"]
          environment:
            WEB_URL: "{{ web_url }}"
            WEB_TEST_PASSWORD: "{{ vault_web_test_password }}"
          register: accounts
          changed_when: "'created' in accounts.stdout or 'joined' in accounts.stdout"

        - name: Show what it did
          ansible.builtin.debug:
            msg: "{{ accounts.stdout_lines }}"

# Browsers refuse or warn on plain http to a ts.net name, so the team's address is HTTPS. Only the
# node itself can get a certificate for its name, so tailscaled serves it. Traefik holds 443 on the nodes but routes nothing, and tailscaled answers tailnet traffic
# before it reaches the kernel, so the two don't meet.
- name: Serve the web app over HTTPS on each node's tailnet name
  hosts: k3s_cluster
  become: true
  gather_facts: false
  tags: [serve]
  vars:
    web_serve_host: "{{ inventory_hostname }}.{{ tailnet_domain }}"
    # web-local on the node. Not Service web directly: tailscaled's connections don't reach a pod on
    # another node (k8s/apps/web/local-proxy.conf)
    web_serve_target: "http://127.0.0.1:3001"
    web_serve_proxy: >-
      {{ ((web_serve_status.stdout | default('', true) or '{}') | from_json).get('Web', {})
      .get(web_serve_host ~ ':443', {}).get('Handlers', {}).get('/', {}).get('Proxy', '') }}
  tasks:
    - name: Read the node's serve config
      ansible.builtin.command: tailscale serve status --json
      register: web_serve_status
      changed_when: false

    - name: Serve https://<node>.<tailnet> from the web app
      ansible.builtin.command: tailscale serve --bg --https=443 {{ web_serve_target }}
      when: web_serve_proxy != web_serve_target
      changed_when: true

    - name: Request Better Auth's /ok over HTTPS on the node's name
      ansible.builtin.uri:
        url: "https://{{ web_serve_host }}/api/auth/ok"
        return_content: true
        timeout: 30
      register: web_serve_ok
      # The first request on a node waits for its certificate
      until: web_serve_ok is succeeded and (web_serve_ok.json | default({})).ok | default(false)
      retries: 6
      delay: 10
      delegate_to: localhost
      become: false
