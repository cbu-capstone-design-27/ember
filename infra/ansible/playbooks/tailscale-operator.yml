---
# Tailscale Kubernetes operator: serves ingressClassName tailscale, giving each such Ingress its own
# tailnet device and https://<name>.<tailnet_domain> certificate (public too, with Funnel).
# Run from the controller against the "homelab" kubeconfig context.
# Use the make targets: ts-operator-up (prep, up, health), ts-operator-health, ts-operator-down.
- name: Tailscale operator
  hosts: localhost
  gather_facts: false
  vars:
    kubectl: "kubectl --context {{ cluster_context }}"
    helm: "helm --kube-context {{ cluster_context }}"
    k8s_dir: "{{ playbook_dir }}/../../k8s"
    ts_ns: tailscale
    ts_release: tailscale-operator
    ts_chart_version: 1.102.4
    # Every Ingress this operator serves, as "<namespace>/<name>"
    ts_ingresses_jsonpath: >-
      {range .items[?(@.spec.ingressClassName=="tailscale")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}
  tasks:
    - name: Prep
      tags: [prep]
      block:
        - name: Require helm (make deps installs it)
          ansible.builtin.command: helm version --short
          changed_when: false

        - name: Require the OAuth credentials in the vault
          ansible.builtin.assert:
            that:
              - vault_ts_oauth_client_id is defined
              - vault_ts_oauth_client_secret is defined
            fail_msg: >-
              Add vault_ts_oauth_client_id and vault_ts_oauth_client_secret with
              .venv/bin/ansible-vault edit group_vars/all/vault.yml (see k8s/README.md)
            quiet: true

        - name: Apply the namespaces
          ansible.builtin.command: "{{ kubectl }} apply -f {{ k8s_dir }}/infrastructure/namespaces.yaml"
          register: ns_apply
          changed_when: ns_apply.stdout_lines | reject('search', ' unchanged$') | list | length > 0

        - name: Add the Tailscale chart repo
          ansible.builtin.command: helm repo add tailscale https://pkgs.tailscale.com/helmcharts
          register: repo_add
          changed_when: "'already exists' not in repo_add.stdout"

        - name: Refresh the chart repo index
          ansible.builtin.command: helm repo update tailscale
          changed_when: false

    - name: Up
      tags: [up]
      block:
        # Server-side apply, so no last-applied annotation keeps a plaintext copy of the secret.
        # A changed credential only takes effect after: kubectl -n tailscale rollout restart deploy/operator
        - name: Create the operator's OAuth Secret from the vault
          ansible.builtin.command:
            cmd: "{{ kubectl }} apply --server-side --field-manager=ansible -f -"
            stdin: "{{ oauth_secret | to_json }}"
          vars:
            oauth_secret:
              apiVersion: v1
              kind: Secret
              metadata:
                name: operator-oauth
                namespace: "{{ ts_ns }}"
              stringData:
                client_id: "{{ vault_ts_oauth_client_id }}"
                client_secret: "{{ vault_ts_oauth_client_secret }}"
          register: secret_apply
          changed_when: "'unchanged' not in secret_apply.stdout"
          no_log: true

        - name: Install or upgrade the release
          ansible.builtin.command: >-
            {{ helm }} upgrade --install {{ ts_release }} tailscale/tailscale-operator
            --version {{ ts_chart_version }} -n {{ ts_ns }}
            -f {{ k8s_dir }}/infrastructure/tailscale-operator/values.yaml --wait --timeout 5m
          changed_when: true

    - name: Health
      tags: [health]
      block:
        - name: Wait for the operator to be ready
          ansible.builtin.command: "{{ kubectl }} -n {{ ts_ns }} rollout status deploy/operator --timeout=3m"
          changed_when: false

        # The operator logs this when the OAuth client or its tags are wrong
        - name: Check the operator logged in to the tailnet
          ansible.builtin.command: "{{ kubectl }} -n {{ ts_ns }} logs deploy/operator --tail=200"
          register: operator_logs
          changed_when: false
          failed_when: operator_logs.stdout is search('(?i)(requested tags .* invalid|unauthorized|401)')

        - name: List Tailscale Ingresses
          ansible.builtin.command: "{{ kubectl }} get ingress -A -o jsonpath='{{ ts_ingresses_jsonpath }}'"
          register: ts_ingresses
          changed_when: false

        # The proxy has to join the tailnet before the Ingress gets its hostname
        - name: Wait for each Ingress to get its tailnet hostname
          ansible.builtin.command: >-
            {{ kubectl }} -n {{ item.split('/')[0] }} get ingress {{ item.split('/')[1] }}
            -o jsonpath={.status.loadBalancer.ingress[0].hostname}
          loop: "{{ ts_ingresses.stdout_lines }}"
          register: ts_hosts
          until: ts_hosts.stdout | length > 0
          retries: 30
          delay: 10
          changed_when: false

        # The first request waits on the Let's Encrypt certificate, hence the retries
        - name: Request each Ingress over HTTPS
          ansible.builtin.uri:
            url: "https://{{ item.stdout }}/"
            status_code: [200, 301, 302, 404]
            timeout: 60
          loop: "{{ ts_hosts.results }}"
          loop_control:
            label: "{{ item.stdout }}"
          register: over_https
          until: over_https is succeeded
          retries: 12
          delay: 10

        - name: Read the Ingresses with their annotations
          ansible.builtin.command: "{{ kubectl }} get ingress -A -o json"
          register: ingress_json
          changed_when: false

        # Requests from the tailnet resolve through MagicDNS and never use Funnel, so the check
        # above passes even when Funnel is off. Ask a public resolver whether the name exists.
        - name: Look up each Funnel Ingress in public DNS
          ansible.builtin.uri:
            url: "https://cloudflare-dns.com/dns-query?name={{ item.status.loadBalancer.ingress[0].hostname }}&type=A"
            headers:
              accept: application/dns-json
            return_content: true
          loop: "{{ (ingress_json.stdout | from_json)['items'] }}"
          loop_control:
            label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
          when:
            - item.spec.ingressClassName | default('') == 'tailscale'
            - (item.metadata.annotations | default({}))['tailscale.com/funnel'] | default('') == 'true'
          register: public_dns
          until: (public_dns.content | from_json).Answer | default([]) | length > 0
          retries: 6
          delay: 10
          failed_when: false

        - name: Require a public DNS record for each Funnel Ingress
          ansible.builtin.assert:
            that: (item.content | from_json).Answer | default([]) | length > 0
            fail_msg: >-
              {{ item.item.status.loadBalancer.ingress[0].hostname }} has no public DNS record, so only
              tailnet devices can reach it. The proxy lacks the funnel attribute: add
              {"target": ["tag:k8s"], "attr": ["funnel"]} to nodeAttrs in the tailnet policy (k8s/README.md).
            quiet: true
          loop: "{{ public_dns.results | rejectattr('skipped', 'defined') | list }}"
          loop_control:
            label: "{{ item.item.metadata.namespace }}/{{ item.item.metadata.name }}"

        - name: Show the endpoints
          ansible.builtin.debug:
            msg: "{{ ts_hosts.results | map(attribute='stdout') | map('regex_replace', '^', 'https://') | list }}"

    # "never" keeps this out of untagged runs; only --tags down selects it
    - name: Down
      tags: [never, down]
      block:
        # Their proxies and finalizers belong to the operator; removing it first strands them
        - name: List Tailscale Ingresses
          ansible.builtin.command: "{{ kubectl }} get ingress -A -o jsonpath='{{ ts_ingresses_jsonpath }}'"
          register: ts_ingresses
          changed_when: false

        - name: Require no Tailscale Ingresses left
          ansible.builtin.assert:
            that: ts_ingresses.stdout_lines | length == 0
            fail_msg: "Delete these first (make apps-down): {{ ts_ingresses.stdout_lines | join(', ') }}"
            quiet: true

        - name: Uninstall the release
          ansible.builtin.command: "{{ helm }} uninstall {{ ts_release }} -n {{ ts_ns }} --wait --ignore-not-found"
          register: uninstall
          changed_when: "'uninstalled' in uninstall.stdout"

        - name: Remove the OAuth Secret
          ansible.builtin.command: "{{ kubectl }} -n {{ ts_ns }} delete secret operator-oauth --ignore-not-found"
          register: secret_delete
          changed_when: secret_delete.stdout | length > 0

        - name: Note what is kept
          ansible.builtin.debug:
            msg: >-
              The operator's CRDs stay installed, and its device (homelab-operator) stays in the
              tailnet admin console until you remove it there.
