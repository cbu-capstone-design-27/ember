---
# Checks k8s/apps on the cluster end to end: nginx, the reverse proxy behind the public
# https://ember.<tailnet_domain> (a Tailscale Funnel Ingress), and intake, the webhook listener it
# routes /webhook/ to, and the enrich workers behind it, and the web app, tailnet only, on
# https://<node>.<tailnet_domain> and https://ember-web.<tailnet_domain>. Flux deploys them
# (playbooks/flux.yml); this playbook deploys nothing.
# Run from the controller against the "homelab" kubeconfig context. Use make apps-health.
- name: Apps
  hosts: localhost
  gather_facts: false
  vars:
    kubectl: "kubectl --context {{ cluster_context }}"
    # Every app lives in this namespace, so rollout status runs there
    apps_ns: ember
    # The name the GitHub App posts to
    ember_host: "ember.{{ tailnet_domain }}"
    ember_url: "https://{{ ember_host }}"
    webhook_url: "{{ ember_url }}/webhook/github"
    # The A records (type 1) in the public DNS answer, which can list a CNAME before them
    # One per enrich worker on the cluster: Deployment enrich-<source>, which logs "enrich:<source> listening"
    enrich_sources: [github, slack, jira, gitlab]
    # The web app's own Tailscale Ingress, without Funnel (k8s/apps/web)
    web_host: "ember-web.{{ tailnet_domain }}"
    web_url: "https://{{ web_host }}"
    # The same app on every node's name: tailscale serve (make web-serve) in front of web-local
    # (k8s/apps/web/local-proxy.yaml)
    web_main_url: "https://pi-cp.{{ tailnet_domain }}"
    web_public_ips: >-
      {{ (web_public_dns.content | default('{}') | from_json).Answer | default([])
      | selectattr('type', 'equalto', 1) | map(attribute='data') | list }}
    public_ips: >-
      {{ (public_dns.content | default('{}') | from_json).Answer | default([])
      | selectattr('type', 'equalto', 1) | map(attribute='data') | list }}
  tasks:
    - name: Rollout
      tags: [health]
      block:
        - name: List the workloads in {{ apps_ns }}
          ansible.builtin.command: "{{ kubectl }} -n {{ apps_ns }} get deployment,statefulset,daemonset -o name"
          register: apps_objects
          changed_when: false

        - name: Wait for each workload to roll out
          ansible.builtin.command: "{{ kubectl }} -n {{ apps_ns }} rollout status {{ item }} --timeout=180s"
          loop: "{{ apps_objects.stdout_lines }}"
          changed_when: false

    # A rolled-out worker can still be failing to reach Postgres. It logs "listening" only once its
    # LISTEN connection is up, and a restart after that would show in the restart count
    - name: Enrich workers
      tags: [health]
      block:
        - name: Read each worker's log since its pod started
          ansible.builtin.command: "{{ kubectl }} -n {{ apps_ns }} logs deploy/enrich-{{ item }}"
          loop: "{{ enrich_sources }}"
          register: enrich_logs
          until: ("enrich:" ~ item ~ " listening") in enrich_logs.stdout
          retries: 6
          delay: 5
          changed_when: false
          failed_when: false

        - name: Require each worker to be listening
          ansible.builtin.assert:
            that: ("enrich:" ~ item.item ~ " listening") in item.stdout
            fail_msg: >-
              enrich-{{ item.item }} rolled out but never logged "enrich:{{ item.item }} listening", so it
              is not taking work. Its log: {{ (item.stdout ~ item.stderr) | default('') | truncate(2000) }}
            quiet: true
          loop: "{{ enrich_logs.results }}"
          loop_control:
            label: "enrich-{{ item.item }}"

    - name: Web app
      tags: [health]
      block:
        - name: Wait for the web Ingress to get its tailnet hostname
          ansible.builtin.command: >-
            {{ kubectl }} -n {{ apps_ns }} get ingress web
            -o jsonpath={.status.loadBalancer.ingress[0].hostname}
          register: web_ingress_host
          until: web_ingress_host.stdout | length > 0
          retries: 30
          delay: 10
          changed_when: false

        # BETTER_AUTH_URL in the Deployment names this host; under another name Better Auth refuses
        # every sign-in's Origin
        - name: Require the hostname BETTER_AUTH_URL names
          ansible.builtin.assert:
            that: web_ingress_host.stdout == web_host
            fail_msg: >-
              The web Ingress is published as {{ web_ingress_host.stdout }}, not {{ web_host }}. A
              recreated Tailscale device comes back as ember-web-1 while an older device still holds the
              plain name: remove the stale one in the Tailscale admin console (k8s/README.md, web).
            quiet: true

        # Without DATABASE_URL the app would quietly keep accounts in a SQLite file in the pod
        - name: Read the web app's log since its pod started
          ansible.builtin.command: "{{ kubectl }} -n {{ apps_ns }} logs deploy/web"
          register: web_log
          changed_when: false

        - name: Require it to use Postgres
          ansible.builtin.assert:
            that: "'Auth database: Postgres' in web_log.stdout"
            fail_msg: >-
              The web app did not log "Auth database: Postgres", so accounts are not going to the
              cluster's Postgres. Its log: {{ web_log.stdout | truncate(2000) }}
            quiet: true

        # The first request waits on the Let's Encrypt certificate, hence the retries
        - name: Request Better Auth's /ok from the tailnet
          ansible.builtin.uri:
            url: "{{ web_url }}/api/auth/ok"
            return_content: true
            timeout: 60
          register: web_ok
          until: web_ok is succeeded and (web_ok.json | default({})).ok | default(false)
          retries: 12
          delay: 10

        # Tailnet only: a public record would mean Funnel is on for it
        - name: Look the web app's name up in public DNS
          ansible.builtin.uri:
            url: "https://cloudflare-dns.com/dns-query?name={{ web_host }}&type=A"
            headers:
              accept: application/dns-json
            return_content: true
          register: web_public_dns

        - name: Require no public DNS record for the web app
          ansible.builtin.assert:
            that: web_public_ips | length == 0
            fail_msg: >-
              {{ web_host }} has a public DNS record ({{ web_public_ips | join(', ') }}), so the web app
              is reachable from the internet. It is meant to be tailnet only: remove any
              tailscale.com/funnel annotation from k8s/apps/web/ingress.yaml.
            quiet: true

        # A failure here on every node: run make web-serve, and check DaemonSet web-local is ready
        - name: Request Better Auth's /ok over HTTPS on each node's tailnet name
          ansible.builtin.uri:
            url: "https://{{ item }}.{{ tailnet_domain }}/api/auth/ok"
            return_content: true
            timeout: 20
          register: web_node_ok
          until: web_node_ok is succeeded and (web_node_ok.json | default({})).ok | default(false)
          retries: 6
          delay: 10
          loop: "{{ groups['k3s_cluster'] }}"

        # A browser on each name sends it as Origin. Better Auth answers 403 "Invalid origin" to one
        # missing from BETTER_AUTH_URL and BETTER_AUTH_TRUSTED_ORIGINS, before it looks at the
        # account; a trusted one gets as far as the password, and an account that doesn't exist is 401
        - name: Sign in from each node's name with an account that doesn't exist
          ansible.builtin.uri:
            url: "https://{{ item }}.{{ tailnet_domain }}/api/auth/sign-in/email"
            method: POST
            headers:
              Origin: "https://{{ item }}.{{ tailnet_domain }}"
            body_format: json
            body:
              email: apps-health@example.com
              password: not-a-real-password
            status_code: [401, 403, 429]
            return_content: true
            timeout: 20
          register: web_node_origin
          loop: "{{ groups['k3s_cluster'] }}"

        - name: Require each node's name to be a trusted origin
          ansible.builtin.assert:
            that: item.status != 403
            fail_msg: >-
              Better Auth refused https://{{ item.item }}.{{ tailnet_domain }} as an
              origin ({{ item.content | default('') | truncate(200) }}), so sign-in fails on that address.
              Add it to BETTER_AUTH_TRUSTED_ORIGINS in k8s/apps/web/deployment.yaml.
            quiet: true
          loop: "{{ web_node_origin.results }}"
          loop_control:
            label: "{{ item.item }}"

    - name: Health
      tags: [health]
      block:
        # The proxy has to join the tailnet before the Ingress gets its hostname
        - name: Wait for the Ingress to get its tailnet hostname
          ansible.builtin.command: >-
            {{ kubectl }} -n {{ apps_ns }} get ingress ember
            -o jsonpath={.status.loadBalancer.ingress[0].hostname}
          register: ingress_host
          until: ingress_host.stdout | length > 0
          retries: 30
          delay: 10
          changed_when: false

        - name: Require the hostname GitHub posts to
          ansible.builtin.assert:
            that: ingress_host.stdout == ember_host
            fail_msg: >-
              The Ingress is published as {{ ingress_host.stdout }}, not {{ ember_host }}, so nothing
              answers GitHub at {{ webhook_url }}. A recreated Tailscale device comes back as ember-1
              while an older device still holds the plain name (k8s/README.md).
            quiet: true

        # The first request waits on the Let's Encrypt certificate, hence the retries
        - name: Request /healthz from nginx
          ansible.builtin.uri:
            url: "{{ ember_url }}/healthz"
            status_code: 200
            timeout: 60
          register: healthz
          until: healthz is succeeded
          retries: 12
          delay: 10

        # An unsigned ping, which intake must refuse with 401 and store nothing. nginx keeps the
        # Service's address for 60s, so after the Service is recreated it can answer 502 for up to a
        # minute. Intake counts these as result="unauthorized" in its metrics.
        - name: Post an unsigned ping to the webhook
          ansible.builtin.uri:
            url: "{{ webhook_url }}"
            method: POST
            body_format: json
            body:
              zen: ember apps-health
            headers:
              X-GitHub-Event: ping
              X-GitHub-Delivery: apps-health
            status_code: 401
            return_content: true
          register: ping
          until: ping is succeeded
          retries: 12
          delay: 10

        # The routing proof: only intake answers with this body, nginx on its own cannot
        - name: Require intake's answer
          ansible.builtin.assert:
            that: (ping.json | default({})).error | default('') == 'invalid signature'
            fail_msg: >-
              POST {{ webhook_url }} returned 401 but not intake's {"error": "invalid signature"},
              so the request did not reach Service intake.
              It answered: {{ ping.content | default('') }}
            quiet: true

        # Requests from the tailnet resolve through MagicDNS and never use Funnel, so everything
        # above passes even when GitHub cannot get in. Ask a public resolver for the address and
        # send the same ping there. After the Ingress is recreated the public record can take minutes to return.
        - name: Look the name up in public DNS
          ansible.builtin.uri:
            url: "https://cloudflare-dns.com/dns-query?name={{ ember_host }}&type=A"
            headers:
              accept: application/dns-json
            return_content: true
          register: public_dns
          until: public_ips | length > 0
          retries: 30
          delay: 10
          failed_when: false

        - name: Require a public DNS record
          ansible.builtin.assert:
            that: public_ips | length > 0
            fail_msg: >-
              {{ ember_host }} still has no public DNS record, so only tailnet devices can reach it and
              GitHub cannot. Most likely the proxy lacks the funnel attribute: make ts-operator-health
              checks that and says how to fix it.
              The resolver answered: {{ public_dns.content | default(public_dns.msg | default('nothing')) }}
            quiet: true

        # A tailnet address (100.64.0.0/10) would take the next request past Funnel and prove nothing
        - name: Require that address to be outside the tailnet
          ansible.builtin.assert:
            that: public_ips[0] is not match('100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.')
            fail_msg: "Public DNS gave the tailnet address {{ public_ips[0] }} for {{ ember_host }}"
            quiet: true

        # --resolve pins the name to the public address. The status code is the last line of the output
        - name: Post an unsigned ping through Funnel
          ansible.builtin.command:
            argv:
              - curl
              - --silent
              - --show-error
              - --max-time
              - "30"
              - --write-out
              - "\n%{http_code}"
              - --resolve
              - "{{ ember_host }}:443:{{ public_ips[0] }}"
              - --header
              - "Content-Type: application/json"
              - --header
              - "X-GitHub-Event: ping"
              - --header
              - "X-GitHub-Delivery: apps-health"
              - --data
              - '{"zen": "ember apps-health"}'
              - "{{ webhook_url }}"
          register: via_funnel
          until: via_funnel.rc == 0 and via_funnel.stdout_lines[-1] == '401'
          retries: 6
          delay: 10
          changed_when: false
          failed_when: false

        # The conditions before from_json keep it away from a body that is not JSON
        - name: Require intake's answer through Funnel
          ansible.builtin.assert:
            that:
              - via_funnel.rc == 0
              - via_funnel.stdout_lines[-1] == '401'
              - via_funnel.stdout_lines[0] is match('\s*\{')
              - (via_funnel.stdout_lines[0] | from_json).error | default('') == 'invalid signature'
            fail_msg: >-
              POST {{ webhook_url }} through Funnel ({{ public_ips[0] }}) did not return intake's 401
              {"error": "invalid signature"}, so the public request did not reach Service intake.
              It answered: {{ via_funnel.stdout | default(via_funnel.stderr | default('')) }}
            quiet: true

        - name: Request a path nginx does not route
          ansible.builtin.uri:
            url: "{{ ember_url }}/ember-apps-health-no-such-path"
            status_code: 404

        - name: Show the endpoints
          ansible.builtin.debug:
            msg:
              - "Webhook: {{ webhook_url }} (POST)"
              - "Probe:   {{ ember_url }}/healthz"
              - "Web app: {{ web_main_url }}, or any node's name (tailnet only)"
              - "         {{ web_url }} (devices ember-web is shared with)"
