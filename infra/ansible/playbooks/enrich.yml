---
# Writes the enrich workers' source credentials as Secrets, encrypted with the public key in .sops.yaml.
# GitHub: k8s/apps/enrich-github/github-app.sops.yaml, Secret enrich-github-app, from
# vault_github_app_private_key, the PEM of the GitHub App's private key (k8s/README.md, enrich-github).
# Use make enrich-github-secret.
# Slack: k8s/apps/enrich-slack/slack-bot.sops.yaml, Secret enrich-slack-bot, from vault_slack_bot_token,
# the Slack app's Bot User OAuth Token (k8s/README.md, enrich-slack). Use make enrich-slack-secret.
# Jira: k8s/apps/enrich-jira/jira-api.sops.yaml, Secret enrich-jira-api, from vault_jira_email and
# vault_jira_api_token, an Atlassian account and its API token (k8s/README.md, enrich-jira). Use
# make enrich-jira-secret.
# GitLab: k8s/apps/enrich-gitlab/gitlab-api.sops.yaml, Secret enrich-gitlab-api, from
# vault_gitlab_api_token, a read_api token (k8s/README.md, enrich-gitlab). Use make enrich-gitlab-secret.
# The values are never printed. Commit the file it writes.
- name: Enrich
  hosts: localhost
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir }}/../../.."
    github_secret_file: infra/k8s/apps/enrich-github/github-app.sops.yaml
    # openssl wants the PEM to end in a newline; the vault may not keep it
    github_app_key: "{{ (vault_github_app_private_key | default('') | trim) ~ '\n' }}"
    github_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: enrich-github-app
        namespace: ember
      stringData:
        private-key.pem: "{{ github_app_key }}"
    slack_secret_file: infra/k8s/apps/enrich-slack/slack-bot.sops.yaml
    slack_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: enrich-slack-bot
        namespace: ember
      stringData:
        SLACK_BOT_TOKEN: "{{ vault_slack_bot_token | default('') | trim }}"
    jira_secret_file: infra/k8s/apps/enrich-jira/jira-api.sops.yaml
    jira_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: enrich-jira-api
        namespace: ember
      stringData:
        JIRA_EMAIL: "{{ vault_jira_email | default('') | trim }}"
        JIRA_API_TOKEN: "{{ vault_jira_api_token | default('') | trim }}"
    gitlab_secret_file: infra/k8s/apps/enrich-gitlab/gitlab-api.sops.yaml
    gitlab_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: enrich-gitlab-api
        namespace: ember
      stringData:
        GITLAB_API_TOKEN: "{{ vault_gitlab_api_token | default('') | trim }}"
  tasks:
    - name: GitHub
      tags: [secret-github]
      block:
        - name: Require the App key in the vault
          ansible.builtin.assert:
            that:
              - vault_github_app_private_key is defined
              - vault_github_app_private_key is string
              - "'-----BEGIN' in vault_github_app_private_key"
              - "'PRIVATE KEY-----' in vault_github_app_private_key"
            fail_msg: >-
              Add vault_github_app_private_key, the whole .pem the GitHub App generated (a YAML block
              scalar, |), with .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        # Encrypting again gives new ciphertext every time, so only write when the value changed
        - name: Read the key the file holds now
          ansible.builtin.command:
            argv: [sops, --decrypt, --extract, '["stringData"]["private-key.pem"]', "{{ github_secret_file }}"]
            chdir: "{{ repo_dir }}"
          environment:
            SOPS_AGE_KEY: "{{ vault_sops_age_key | default('') }}"
          register: current
          changed_when: false
          failed_when: false
          no_log: true

        - name: Encrypt the Secret
          ansible.builtin.command:
            argv: [sops, --encrypt, --filename-override, "{{ github_secret_file }}",
                   --input-type, json, --output-type, yaml, /dev/stdin]
            chdir: "{{ repo_dir }}"
            stdin: "{{ github_secret | to_json }}"
          register: encrypted
          when: current.rc != 0 or (current.stdout | trim) != (github_app_key | trim)
          changed_when: false
          no_log: true

        - name: Write it to {{ github_secret_file }}
          ansible.builtin.copy:
            content: "{{ encrypted.stdout }}\n"
            dest: "{{ repo_dir }}/{{ github_secret_file }}"
            mode: "0644"
          when: encrypted is not skipped

        - name: Say what to do next
          ansible.builtin.debug:
            msg: >-
              {{ github_secret_file ~ ' is written. Commit and merge it, then restart the worker: kubectl --context homelab -n ember rollout restart deploy/enrich-github'
                 if encrypted is not skipped else github_secret_file ~ ' already holds the vault value; nothing to do' }}

    - name: Slack
      tags: [secret-slack]
      block:
        # The worker refuses user (xoxp-) and app-level (xapp-) tokens (pull_test.bot_token)
        - name: Require the bot token in the vault
          ansible.builtin.assert:
            that:
              - vault_slack_bot_token is defined
              - vault_slack_bot_token is string
              - vault_slack_bot_token | trim is match('(xoxb-|xoxe\\.xoxb-)')
            fail_msg: >-
              Add vault_slack_bot_token, the Slack app's Bot User OAuth Token (xoxb-..., from OAuth &
              Permissions), with .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        # Encrypting again gives new ciphertext every time, so only write when the value changed
        - name: Read the token the file holds now
          ansible.builtin.command:
            argv: [sops, --decrypt, --extract, '["stringData"]["SLACK_BOT_TOKEN"]', "{{ slack_secret_file }}"]
            chdir: "{{ repo_dir }}"
          environment:
            SOPS_AGE_KEY: "{{ vault_sops_age_key | default('') }}"
          register: current
          changed_when: false
          failed_when: false
          no_log: true

        - name: Encrypt the Secret
          ansible.builtin.command:
            argv: [sops, --encrypt, --filename-override, "{{ slack_secret_file }}",
                   --input-type, json, --output-type, yaml, /dev/stdin]
            chdir: "{{ repo_dir }}"
            stdin: "{{ slack_secret | to_json }}"
          register: encrypted
          when: current.rc != 0 or current.stdout != slack_secret.stringData.SLACK_BOT_TOKEN
          changed_when: false
          no_log: true

        - name: Write it to {{ slack_secret_file }}
          ansible.builtin.copy:
            content: "{{ encrypted.stdout }}\n"
            dest: "{{ repo_dir }}/{{ slack_secret_file }}"
            mode: "0644"
          when: encrypted is not skipped

        - name: Say what to do next
          ansible.builtin.debug:
            msg: >-
              {{ slack_secret_file ~ ' is written. Commit and merge it, then restart the worker: kubectl --context homelab -n ember rollout restart deploy/enrich-slack'
                 if encrypted is not skipped else slack_secret_file ~ ' already holds the vault value; nothing to do' }}

    - name: Jira
      tags: [secret-jira]
      block:
        - name: Require the account and its API token in the vault
          ansible.builtin.assert:
            that:
              - vault_jira_email is defined
              - vault_jira_email is string
              - vault_jira_email | trim is match('[^@\\s]+@[^@\\s]+$')
              - vault_jira_api_token is defined
              - vault_jira_api_token is string
              - vault_jira_api_token | trim | length > 0
            fail_msg: >-
              Add vault_jira_email, the Atlassian account the worker reads Jira as, and
              vault_jira_api_token, an API token for it (id.atlassian.com, Security, API tokens), with
              .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        # Encrypting again gives new ciphertext every time, so only write when a value changed
        - name: Read the values the file holds now
          ansible.builtin.command:
            argv: [sops, --decrypt, --extract, '["stringData"]', --output-type, json, "{{ jira_secret_file }}"]
            chdir: "{{ repo_dir }}"
          environment:
            SOPS_AGE_KEY: "{{ vault_sops_age_key | default('') }}"
          register: current
          changed_when: false
          failed_when: false
          no_log: true

        - name: Encrypt the Secret
          ansible.builtin.command:
            argv: [sops, --encrypt, --filename-override, "{{ jira_secret_file }}",
                   --input-type, json, --output-type, yaml, /dev/stdin]
            chdir: "{{ repo_dir }}"
            stdin: "{{ jira_secret | to_json }}"
          register: encrypted
          when: current.rc != 0 or (current.stdout | from_json) != jira_secret.stringData
          changed_when: false
          no_log: true

        - name: Write it to {{ jira_secret_file }}
          ansible.builtin.copy:
            content: "{{ encrypted.stdout }}\n"
            dest: "{{ repo_dir }}/{{ jira_secret_file }}"
            mode: "0644"
          when: encrypted is not skipped

        - name: Say what to do next
          ansible.builtin.debug:
            msg: >-
              {{ jira_secret_file ~ ' is written. Commit and merge it, then restart the worker: kubectl --context homelab -n ember rollout restart deploy/enrich-jira'
                 if encrypted is not skipped else jira_secret_file ~ ' already holds the vault value; nothing to do' }}

    - name: GitLab
      tags: [secret-gitlab]
      block:
        - name: Require the read_api token in the vault
          ansible.builtin.assert:
            that:
              - vault_gitlab_api_token is defined
              - vault_gitlab_api_token is string
              - vault_gitlab_api_token | trim | length > 0
            fail_msg: >-
              Add vault_gitlab_api_token, a token with the read_api scope (a group access token on Premium or
              Ultimate, else a personal access token), with .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        # Encrypting again gives new ciphertext every time, so only write when a value changed
        - name: Read the values the file holds now
          ansible.builtin.command:
            argv: [sops, --decrypt, --extract, '["stringData"]', --output-type, json, "{{ gitlab_secret_file }}"]
            chdir: "{{ repo_dir }}"
          environment:
            SOPS_AGE_KEY: "{{ vault_sops_age_key | default('') }}"
          register: current
          changed_when: false
          failed_when: false
          no_log: true

        - name: Encrypt the Secret
          ansible.builtin.command:
            argv: [sops, --encrypt, --filename-override, "{{ gitlab_secret_file }}",
                   --input-type, json, --output-type, yaml, /dev/stdin]
            chdir: "{{ repo_dir }}"
            stdin: "{{ gitlab_secret | to_json }}"
          register: encrypted
          when: current.rc != 0 or (current.stdout | from_json) != gitlab_secret.stringData
          changed_when: false
          no_log: true

        - name: Write it to {{ gitlab_secret_file }}
          ansible.builtin.copy:
            content: "{{ encrypted.stdout }}\n"
            dest: "{{ repo_dir }}/{{ gitlab_secret_file }}"
            mode: "0644"
          when: encrypted is not skipped

        - name: Say what to do next
          ansible.builtin.debug:
            msg: >-
              {{ gitlab_secret_file ~ ' is written. Commit and merge it, then restart the worker: kubectl --context homelab -n ember rollout restart deploy/enrich-gitlab'
                 if encrypted is not skipped else gitlab_secret_file ~ ' already holds the vault value; nothing to do' }}
