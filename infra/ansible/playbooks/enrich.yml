---
# Writes the enrich workers' source credentials as Secrets, encrypted with the public key in .sops.yaml.
# GitHub: k8s/apps/enrich-github/github-app.sops.yaml, Secret enrich-github-app, from
# vault_github_app_private_key, the PEM of the GitHub App's private key (k8s/README.md, enrich-github).
# The value is never printed. Commit the file it writes. Use make enrich-github-secret.
- name: Enrich
  hosts: localhost
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir }}/../../.."
    github_secret_file: infra/k8s/apps/enrich-github/github-app.sops.yaml
    # openssl wants the PEM to end in a newline; the vault may not keep it
    github_app_key: "{{ (vault_github_app_private_key | default('') | trim) ~ '\n' }}"
    github_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: enrich-github-app
        namespace: ember
      stringData:
        private-key.pem: "{{ github_app_key }}"
  tasks:
    - name: GitHub
      tags: [secret-github]
      block:
        - name: Require the App key in the vault
          ansible.builtin.assert:
            that:
              - vault_github_app_private_key is defined
              - vault_github_app_private_key is string
              - "'-----BEGIN' in vault_github_app_private_key"
              - "'PRIVATE KEY-----' in vault_github_app_private_key"
            fail_msg: >-
              Add vault_github_app_private_key, the whole .pem the GitHub App generated (a YAML block
              scalar, |), with .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        # Encrypting again gives new ciphertext every time, so only write when the value changed
        - name: Read the key the file holds now
          ansible.builtin.command:
            argv: [sops, --decrypt, --extract, '["stringData"]["private-key.pem"]', "{{ github_secret_file }}"]
            chdir: "{{ repo_dir }}"
          environment:
            SOPS_AGE_KEY: "{{ vault_sops_age_key | default('') }}"
          register: current
          changed_when: false
          failed_when: false
          no_log: true

        - name: Encrypt the Secret
          ansible.builtin.command:
            argv: [sops, --encrypt, --filename-override, "{{ github_secret_file }}",
                   --input-type, json, --output-type, yaml, /dev/stdin]
            chdir: "{{ repo_dir }}"
            stdin: "{{ github_secret | to_json }}"
          register: encrypted
          when: current.rc != 0 or (current.stdout | trim) != (github_app_key | trim)
          changed_when: false
          no_log: true

        - name: Write it to {{ github_secret_file }}
          ansible.builtin.copy:
            content: "{{ encrypted.stdout }}\n"
            dest: "{{ repo_dir }}/{{ github_secret_file }}"
            mode: "0644"
          when: encrypted is not skipped

        - name: Say what to do next
          ansible.builtin.debug:
            msg: >-
              {{ github_secret_file ~ ' is written. Commit and merge it, then restart the worker: kubectl --context homelab -n ember rollout restart deploy/enrich-github'
                 if encrypted is not skipped else github_secret_file ~ ' already holds the vault value; nothing to do' }}
