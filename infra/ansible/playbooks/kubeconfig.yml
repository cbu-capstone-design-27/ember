# Fetches the server's kubeconfig and merges it into ~/.kube/config as context "{{ cluster_context }}".
# Replaces `k3s.orchestration.site --tags kubeconfig`: the collection doesn't tag its fetch/merge block,
# so that run only copies k3s.yaml on the server and never writes anything locally.
- name: Merge the cluster kubeconfig into ~/.kube/config
  hosts: server[0]
  gather_facts: false
  vars:
    local_copy: ~/.kube/{{ cluster_context }}.yaml
  tasks:
    - name: Create ~/.kube
      ansible.builtin.file:
        path: ~/.kube
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Fetch k3s.yaml
      become: true
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ local_copy }}"
        flat: true

    - name: Restrict the local copy to its owner
      ansible.builtin.file:
        path: "{{ local_copy }}"
        mode: "0600"
      delegate_to: localhost

    # k3s names its cluster, user and context "default"; rename all three so the merge can't clash.
    - name: Rename "default" to {{ cluster_context }}
      ansible.builtin.replace:
        path: "{{ local_copy }}"
        regexp: '\bdefault\b'
        replace: "{{ cluster_context }}"
      delegate_to: localhost

    - name: Point the server address at the API endpoint
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ local_copy }} config set-cluster {{ cluster_context }}
        --server=https://{{ api_endpoint | ansible.utils.ipwrap }}:6443
      delegate_to: localhost
      changed_when: true

    # The fetched file comes first, so its entries replace stale ones from an earlier run.
    - name: Merge into ~/.kube/config
      ansible.builtin.shell: |
        set -e
        tmp=$(mktemp ~/.kube/config.XXXXXX)
        KUBECONFIG={{ local_copy }}:$HOME/.kube/config kubectl config view --flatten > "$tmp"
        chmod 600 "$tmp"
        mv "$tmp" ~/.kube/config
      delegate_to: localhost
      changed_when: true
