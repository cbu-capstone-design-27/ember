---
# TEMPORARY (EMBER-49), with k8s/apps/llm-tunnel: remove both once the Spark's chat model has an
# endpoint the cluster can reach without a tunnel.
# Writes k8s/apps/llm-tunnel/ssh.sops.yaml, Secret llm-tunnel-ssh, encrypted with the public key in
# .sops.yaml, from vault_llm_tunnel_ssh_key: the private key save-water@172.99.171.11 accepts for the
# 127.0.0.1:8001 and 127.0.0.1:8000 forwards only (k8s/README.md, llm-tunnel). The value is never printed. Commit the file
# it writes. Use make llm-tunnel-secret.
- name: llm-tunnel
  hosts: localhost
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir }}/../../.."
    secret_file: infra/k8s/apps/llm-tunnel/ssh.sops.yaml
    # ssh wants the key to end in a newline; the vault may not keep it
    ssh_key: "{{ (vault_llm_tunnel_ssh_key | default('') | trim) ~ '\n' }}"
    tunnel_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: llm-tunnel-ssh
        namespace: ember
      stringData:
        id_ed25519: "{{ ssh_key }}"
  tasks:
    - name: Secret
      tags: [secret]
      block:
        - name: Require the key in the vault
          ansible.builtin.assert:
            that:
              - vault_llm_tunnel_ssh_key is defined
              - vault_llm_tunnel_ssh_key is string
              - "'-----BEGIN OPENSSH PRIVATE KEY-----' in vault_llm_tunnel_ssh_key"
            fail_msg: >-
              Add vault_llm_tunnel_ssh_key, a private key from ssh-keygen -t ed25519 (a YAML block
              scalar, |), with .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        # Encrypting again gives new ciphertext every time, so only write when the value changed
        - name: Read the key the file holds now
          ansible.builtin.command:
            argv: [sops, --decrypt, --extract, '["stringData"]["id_ed25519"]', "{{ secret_file }}"]
            chdir: "{{ repo_dir }}"
          environment:
            SOPS_AGE_KEY: "{{ vault_sops_age_key | default('') }}"
          register: current
          changed_when: false
          failed_when: false
          no_log: true

        - name: Encrypt the Secret
          ansible.builtin.command:
            argv: [sops, --encrypt, --filename-override, "{{ secret_file }}",
                   --input-type, json, --output-type, yaml, /dev/stdin]
            chdir: "{{ repo_dir }}"
            stdin: "{{ tunnel_secret | to_json }}"
          register: encrypted
          when: current.rc != 0 or (current.stdout | trim) != (ssh_key | trim)
          changed_when: false
          no_log: true

        - name: Write it to {{ secret_file }}
          ansible.builtin.copy:
            content: "{{ encrypted.stdout }}\n"
            dest: "{{ repo_dir }}/{{ secret_file }}"
            mode: "0644"
          when: encrypted is not skipped

        # The public half goes on the Spark, restricted to this one forward
        - name: Derive the public key
          ansible.builtin.shell: ssh-keygen -y -f /dev/stdin <<< "$KEY"
          args:
            executable: /bin/bash
          environment:
            KEY: "{{ ssh_key }}"
          register: public_key
          changed_when: false
          no_log: true

        - name: Say what to do next
          ansible.builtin.debug:
            msg:
              - "{{ secret_file ~ (' is written. Commit and merge it, then: kubectl --context homelab -n ember rollout restart deploy/llm-tunnel' if encrypted is not skipped else ' already holds the vault value') }}"
              - "On the Spark, save-water's ~/.ssh/authorized_keys needs this line:"
              - 'restrict,port-forwarding,permitopen="127.0.0.1:8001",permitopen="127.0.0.1:8000",command="/bin/false" {{ public_key.stdout }}'
