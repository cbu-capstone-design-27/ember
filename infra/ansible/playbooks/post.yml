---
- name: Let the admin user run k3s and kubectl on the server
  hosts: server
  become: true
  tasks:
    # 0640 root:adm; without read access every k3s/kubectl call as ansible_user
    # warns "open /etc/rancher/k3s/config.yaml: permission denied"
    - name: Give the adm group read access to the k3s config
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml
        group: adm
        mode: "{{ k3s_server_config_mode }}"
