---
# Writes k8s/apps/intake/webhooks.sops.yaml, Secret intake-webhooks, from the vault, encrypted with
# the public key in .sops.yaml. vault_github_webhook_secret is the GitHub App's webhook secret
# (k8s/README.md, "The webhook secret"). The value is never printed. Commit the file it writes.
# Use make intake-secret.
- name: Intake
  hosts: localhost
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir }}/../../.."
    secret_file: infra/k8s/apps/intake/webhooks.sops.yaml
    intake_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: intake-webhooks
        namespace: ember
      stringData:
        GITHUB_WEBHOOK_SECRET: "{{ vault_github_webhook_secret }}"
  tasks:
    - name: Secret
      tags: [secret]
      block:
        # Intake refuses to start on an empty secret or one with spaces around it
        - name: Require the webhook secret in the vault
          ansible.builtin.assert:
            that:
              - vault_github_webhook_secret is defined
              - vault_github_webhook_secret is string
              - vault_github_webhook_secret | length > 0
              - vault_github_webhook_secret == vault_github_webhook_secret | trim
            fail_msg: >-
              Add vault_github_webhook_secret (openssl rand -hex 32) with
              .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        # Encrypting again gives new ciphertext every time, so only write when the value changed
        - name: Read the secret the file holds now
          ansible.builtin.command:
            argv: [sops, --decrypt, --extract, '["stringData"]["GITHUB_WEBHOOK_SECRET"]', "{{ secret_file }}"]
            chdir: "{{ repo_dir }}"
          environment:
            SOPS_AGE_KEY: "{{ vault_sops_age_key | default('') }}"
          register: current
          changed_when: false
          failed_when: false
          no_log: true

        - name: Encrypt the Secret
          ansible.builtin.command:
            argv: [sops, --encrypt, --filename-override, "{{ secret_file }}",
                   --input-type, json, --output-type, yaml, /dev/stdin]
            chdir: "{{ repo_dir }}"
            stdin: "{{ intake_secret | to_json }}"
          register: encrypted
          when: current.rc != 0 or current.stdout != vault_github_webhook_secret
          changed_when: false
          no_log: true

        - name: Write it to {{ secret_file }}
          ansible.builtin.copy:
            content: "{{ encrypted.stdout }}\n"
            dest: "{{ repo_dir }}/{{ secret_file }}"
            mode: "0644"
          when: encrypted is not skipped

        - name: Say what to do next
          ansible.builtin.debug:
            msg: >-
              {{ secret_file ~ ' is written. Commit and merge it, then restart intake: kubectl --context homelab -n ember rollout restart deploy/intake'
                 if encrypted is not skipped else secret_file ~ ' already holds the vault value; nothing to do' }}
