---
# Writes k8s/apps/intake/webhooks.sops.yaml, Secret intake-webhooks, from the vault, encrypted with
# the public key in .sops.yaml. vault_github_webhook_secret is the GitHub App's webhook secret
# (k8s/README.md, "The webhook secret"); vault_slack_signing_secret is the Slack app's signing secret
# (k8s/README.md, "The Slack signing secret"); vault_jira_webhook_secret is the secret saved on the
# Jira site's admin webhook (k8s/README.md, "The Jira webhook secret"); vault_gitlab_webhook_signing_token
# is the signing token GitLab generated for the project webhook (k8s/README.md, "The GitLab signing
# token"). The values are never printed.
# Commit the file it writes. Use make intake-secret.
- name: Intake
  hosts: localhost
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir }}/../../.."
    secret_file: infra/k8s/apps/intake/webhooks.sops.yaml
    intake_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: intake-webhooks
        namespace: ember
      stringData:
        GITHUB_WEBHOOK_SECRET: "{{ vault_github_webhook_secret }}"
        SLACK_SIGNING_SECRET: "{{ vault_slack_signing_secret }}"
        JIRA_WEBHOOK_SECRET: "{{ vault_jira_webhook_secret }}"
        GITLAB_WEBHOOK_SIGNING_TOKEN: "{{ vault_gitlab_webhook_signing_token }}"
  tasks:
    - name: Secret
      tags: [secret]
      block:
        # Intake refuses to start on an empty secret or one with spaces around it
        - name: Require the webhook secret in the vault
          ansible.builtin.assert:
            that:
              - vault_github_webhook_secret is defined
              - vault_github_webhook_secret is string
              - vault_github_webhook_secret | length > 0
              - vault_github_webhook_secret == vault_github_webhook_secret | trim
            fail_msg: >-
              Add vault_github_webhook_secret (openssl rand -hex 32) with
              .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        - name: Require the Slack signing secret in the vault
          ansible.builtin.assert:
            that:
              - vault_slack_signing_secret is defined
              - vault_slack_signing_secret is string
              - vault_slack_signing_secret | length > 0
              - vault_slack_signing_secret == vault_slack_signing_secret | trim
            fail_msg: >-
              Add vault_slack_signing_secret, the Slack app's Signing Secret (Basic Information, App
              Credentials), with .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        - name: Require the Jira webhook secret in the vault
          ansible.builtin.assert:
            that:
              - vault_jira_webhook_secret is defined
              - vault_jira_webhook_secret is string
              - vault_jira_webhook_secret | length > 0
              - vault_jira_webhook_secret == vault_jira_webhook_secret | trim
            fail_msg: >-
              Add vault_jira_webhook_secret (openssl rand -hex 32), the secret you save on the Jira
              site's admin webhook, with .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          no_log: true

        # Intake also refuses one that isn't whsec_ and base64, as GitLab shows it
        - name: Require the GitLab signing token in the vault
          ansible.builtin.assert:
            that:
              - vault_gitlab_webhook_signing_token is defined
              - vault_gitlab_webhook_signing_token is string
              - vault_gitlab_webhook_signing_token == vault_gitlab_webhook_signing_token | trim
              - vault_gitlab_webhook_signing_token is match('whsec_[A-Za-z0-9+/]+=*$')
            fail_msg: >-
              Add vault_gitlab_webhook_signing_token, the whsec_ token GitLab showed once when the project
              webhook was created with Generate signing token, with .venv/bin/ansible-vault edit
              group_vars/all/vault.yml
            quiet: true
          no_log: true

        # Encrypting again gives new ciphertext every time, so only write when the value changed
        - name: Read the secrets the file holds now
          ansible.builtin.command:
            argv: [sops, --decrypt, --extract, '["stringData"]', --output-type, json, "{{ secret_file }}"]
            chdir: "{{ repo_dir }}"
          environment:
            SOPS_AGE_KEY: "{{ vault_sops_age_key | default('') }}"
          register: current
          changed_when: false
          failed_when: false
          no_log: true

        - name: Encrypt the Secret
          ansible.builtin.command:
            argv: [sops, --encrypt, --filename-override, "{{ secret_file }}",
                   --input-type, json, --output-type, yaml, /dev/stdin]
            chdir: "{{ repo_dir }}"
            stdin: "{{ intake_secret | to_json }}"
          register: encrypted
          when: current.rc != 0 or (current.stdout | from_json) != intake_secret.stringData
          changed_when: false
          no_log: true

        - name: Write it to {{ secret_file }}
          ansible.builtin.copy:
            content: "{{ encrypted.stdout }}\n"
            dest: "{{ repo_dir }}/{{ secret_file }}"
            mode: "0644"
          when: encrypted is not skipped

        - name: Say what to do next
          ansible.builtin.debug:
            msg: >-
              {{ secret_file ~ ' is written. Commit and merge it, then restart intake: kubectl --context homelab -n ember rollout restart deploy/intake'
                 if encrypted is not skipped else secret_file ~ ' already holds the vault value; nothing to do' }}
