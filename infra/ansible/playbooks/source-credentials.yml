# secret: writes the key rings that seal source_credentials rows (EMBER-147, ADR 0010), one Secret per
#   kind, encrypted with the public key in .sops.yaml. Commit the files it writes. Use
#   make source-credentials-secret.
#     k8s/apps/source-credentials/api.sops.yaml      Secret source-credentials-api     web app, enrich workers
#     k8s/apps/source-credentials/webhook.sops.yaml  Secret source-credentials-webhook web app, intake
#   Each comes from its vault value, <key id>:<base64 of 32 bytes>, comma-separated, the sealing key
#   first (packages/source-credentials/README.md, Key rings). Make one key with
#   echo "$(date +%Y-%m):$(openssl rand -base64 32)". The two rings never share a key.
# The values are never printed: the checks print only which vault value failed, and the rest runs under no_log.
- name: Source credential key rings
  hosts: localhost
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir }}/../../.."
    # One <id>:<32 bytes as base64> entry, then more after commas. 32 bytes are 43 characters and one "="
    ring_pattern: '^\s*[A-Za-z0-9_-]{1,32}:[A-Za-z0-9+/]{43}=\s*(,\s*[A-Za-z0-9_-]{1,32}:[A-Za-z0-9+/]{43}=\s*)*$'
    rings:
      - kind: api
        name: source-credentials-api
        file: infra/k8s/apps/source-credentials/api.sops.yaml
        env: SOURCE_CREDENTIALS_API_KEYS
        vault_var: vault_source_credentials_api_keys
      - kind: webhook
        name: source-credentials-webhook
        file: infra/k8s/apps/source-credentials/webhook.sops.yaml
        env: SOURCE_CREDENTIALS_WEBHOOK_KEYS
        vault_var: vault_source_credentials_webhook_keys
  tasks:
    - name: Secrets
      tags: [secret]
      block:
        - name: Require both key rings in the vault, well formed
          ansible.builtin.assert:
            that:
              - lookup('vars', item.vault_var, default='') is string
              - lookup('vars', item.vault_var, default='') is regex(ring_pattern)
            fail_msg: >-
              Add {{ item.vault_var }} as <key id>:<base64 of 32 bytes>, e.g. the output of
              echo "$(date +%Y-%m):$(openssl rand -base64 32)", with
              .venv/bin/ansible-vault edit group_vars/all/vault.yml
            quiet: true
          loop: "{{ rings }}"
          loop_control:
            label: "{{ item.vault_var }}"

        # ADR 0004: the key intake verifies with and the key enrich calls with never sit in the same pod
        - name: Require the two rings to share no key
          ansible.builtin.assert:
            that:
              - api_keys | intersect(webhook_keys) | length == 0
            fail_msg: The api and webhook key rings share a key. Give each kind its own.
            quiet: true
          vars:
            api_keys: "{{ vault_source_credentials_api_keys | split(',') | map('trim') | map('regex_replace', '^[^:]*:', '') | list }}"
            webhook_keys: "{{ vault_source_credentials_webhook_keys | split(',') | map('trim') | map('regex_replace', '^[^:]*:', '') | list }}"

        # Encrypting again gives new ciphertext every time, so only write when the value changed
        - name: Read the secrets the files hold now
          ansible.builtin.command:
            argv: [sops, --decrypt, --extract, '["stringData"]', --output-type, json, "{{ item.file }}"]
            chdir: "{{ repo_dir }}"
          environment:
            SOPS_AGE_KEY: "{{ vault_sops_age_key | default('') }}"
          register: current
          changed_when: false
          failed_when: false
          loop: "{{ rings }}"
          loop_control:
            label: "{{ item.file }}"
          no_log: true

        - name: Encrypt the Secrets
          ansible.builtin.command:
            argv: [sops, --encrypt, --filename-override, "{{ item.item.file }}",
                   --input-type, json, --output-type, yaml, /dev/stdin]
            chdir: "{{ repo_dir }}"
            stdin: "{{ secret | to_json }}"
          vars:
            data: "{{ {item.item.env: lookup('vars', item.item.vault_var) | trim} }}"
            secret:
              apiVersion: v1
              kind: Secret
              metadata:
                name: "{{ item.item.name }}"
                namespace: ember
              stringData: "{{ data }}"
          register: encrypted
          when: item.rc != 0 or (item.stdout | from_json) != data
          changed_when: false
          loop: "{{ current.results }}"
          loop_control:
            label: "{{ item.item.file }}"
          no_log: true

        - name: Write them
          ansible.builtin.copy:
            content: "{{ item.stdout }}\n"
            dest: "{{ repo_dir }}/{{ item.item.item.file }}"
            mode: "0644"
          when: item is not skipped
          loop: "{{ encrypted.results }}"
          loop_control:
            label: "{{ item.item.item.file | default('') }}"
          no_log: true
