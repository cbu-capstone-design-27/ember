# Same provisioner as k3s's default local-path class, but a deleted PVC keeps its data.
# Use this for Neo4j, Postgres, and anything else stateful.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
