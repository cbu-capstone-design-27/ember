# Local development infrastructure for Ember.
#
# Usage (from repo root):
#   cp .env.example .env          # first time only; fill in values
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
#
# Neo4j starts by default. github-ingestion, jira-ingestion, slack-ingestion and
# gitlab-ingestion are optional profiles so a plain `up` stays Neo4j-only:
#   docker compose -f infra/docker-compose.yml --env-file .env \
#     --profile github-ingestion up --build github-ingestion
#   docker compose -f infra/docker-compose.yml --env-file .env \
#     --profile slack-ingestion up --build slack-ingestion
#   # one-off Slack backfill (exits when done; resumes if re-run; output in volume slack-backfill-data):
#   docker compose -f infra/docker-compose.yml --env-file .env \
#     --profile slack-backfill run --rm --build slack-backfill
#   # Ember web app on http://localhost:3000 (SQLite in volume web-data):
#   docker compose -f infra/docker-compose.yml --env-file .env \
#     --profile web up --build web
#   docker compose -f infra/docker-compose.yml --env-file .env \
#     --profile jira-ingestion up --build jira-ingestion
#   docker compose -f infra/docker-compose.yml --env-file .env \
#     --profile gitlab-ingestion up --build gitlab-ingestion
# GitLab backfill or reconciliation is a one-off run of the same image:
#   docker compose -f infra/docker-compose.yml --env-file .env \
#     --profile gitlab-backfill run --rm -T gitlab-backfill > gitlab.jsonl
# Postgres, the ingestion store, on localhost:5432, then the migrations applied once.
# `down -v` drops its data:
#   docker compose -f infra/docker-compose.yml --env-file .env \
#     --profile postgres up -d postgres
#   docker compose -f infra/docker-compose.yml --env-file .env \
#     --profile postgres run --rm postgres-migrate
# The pipeline loader (EMBER-45) is a one-off run that reads ./data/raw/<tenant>/
# (set PIPELINE_INPUT=/data/raw/<other-folder> to load a different folder under ./data):
#   docker compose -f infra/docker-compose.yml --env-file .env \
#     --profile pipeline run --rm pipeline

name: ember

services:
  neo4j:
    image: neo4j:5-community
    container_name: ember-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt driver
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-locally}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-change-me-locally}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # EMBER-35. Not part of the default `up` (see profiles).
  github-ingestion:
    profiles: ["github-ingestion"]
    build:
      context: ..
      dockerfile: services/github-ingestion/Dockerfile
    container_name: ember-github-ingestion
    ports:
      - "${GITHUB_INGESTION_PORT:-8080}:${GITHUB_INGESTION_PORT:-8080}"
    environment:
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_PRIVATE_KEY_PATH:-}"
      GITHUB_TEST_REPO: "${GITHUB_TEST_REPO:-}"
      GITHUB_INGESTION_PORT: "${GITHUB_INGESTION_PORT:-8080}"

  # EMBER-36. Not part of the default `up` (see profiles).
  slack-ingestion:
    profiles: ["slack-ingestion"]
    build:
      context: ..
      dockerfile: services/slack-ingestion/Dockerfile
    container_name: ember-slack-ingestion
    ports:
      - "${SLACK_INGESTION_PORT:-8082}:${SLACK_INGESTION_PORT:-8082}"
    environment:
      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:-}"
      SLACK_INGESTION_PORT: "${SLACK_INGESTION_PORT:-8082}"

  # EMBER-52. Same image as slack-ingestion; runs pull_test.py once and exits.
  # Extra flags go after the service name, e.g. `... run --rm slack-backfill
  # python3 pull_test.py --channel C0123ABCD --output /data/slack-intake.jsonl`.
  slack-backfill:
    profiles: ["slack-backfill"]
    build:
      context: ..
      dockerfile: services/slack-ingestion/Dockerfile
    command: ["python3", "pull_test.py", "--output", "/data/slack-intake.jsonl", "--resume"]
    restart: "no"
    environment:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:-}"
      SLACK_TEST_CHANNEL: "${SLACK_TEST_CHANNEL:-}"
      SLACK_PULL_CONCURRENCY: "${SLACK_PULL_CONCURRENCY:-}"
      SLACK_RATE_MODE: "${SLACK_RATE_MODE:-}"
    volumes:
      - slack-backfill-data:/data

  # EMBER-33. Runs on the DGX Spark, not in the default `up`. See
  # services/embedding/README.md.
  embedding:
    profiles: ["embedding"]
    image: "${EMBEDDING_IMAGE:-nvcr.io/nvidia/vllm:26.02-py3}"
    container_name: ember-embedding
    restart: unless-stopped
    ipc: host
    ports:
      - "${EMBEDDING_BIND_ADDR:-127.0.0.1}:${EMBEDDING_PORT:-8000}:8000"
    environment:
      HF_HOME: /models
      VLLM_API_KEY: "${EMBEDDING_API_KEY:-}"
    volumes:
      - embedding-models:/models
    command:
      - vllm
      - serve
      - "${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}"
      - --revision
      - "${EMBEDDING_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}"
      - --runner
      - pooling
      - --served-model-name
      - "${EMBEDDING_SERVED_NAME:-qwen3-embedding-0.6b}"
      - --gpu-memory-utilization
      - "${EMBEDDING_GPU_MEMORY_UTILIZATION:-0.10}"
      - --max-model-len
      - "${EMBEDDING_MAX_MODEL_LEN:-8192}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # EMBER-31. Not part of the default `up` (see profiles).
  jira-ingestion:
    profiles: ["jira-ingestion"]
    build:
      context: ..
      dockerfile: services/jira-ingestion/Dockerfile
    container_name: ember-jira-ingestion
    ports:
      - "${JIRA_INGESTION_PORT:-8081}:${JIRA_INGESTION_PORT:-8081}"
    environment:
      JIRA_WEBHOOK_SECRET: "${JIRA_WEBHOOK_SECRET:-}"
      JIRA_BASE_URL: "${JIRA_BASE_URL:-}"
      JIRA_EMAIL: "${JIRA_EMAIL:-}"
      JIRA_API_TOKEN: "${JIRA_API_TOKEN:-}"
      JIRA_TEST_PROJECT: "${JIRA_TEST_PROJECT:-}"
      JIRA_INGESTION_PORT: "${JIRA_INGESTION_PORT:-8081}"

  # EMBER-54. Webhook receiver. Holds the webhook secrets only, never the API
  # token. Not part of the default `up` (see profiles).
  gitlab-ingestion:
    profiles: ["gitlab-ingestion"]
    build:
      context: ..
      dockerfile: services/gitlab-ingestion/Dockerfile
    image: ember-gitlab-ingestion
    container_name: ember-gitlab-ingestion
    ports:
      - "${GITLAB_INGESTION_PORT:-8083}:${GITLAB_INGESTION_PORT:-8083}"
    environment:
      GITLAB_WEBHOOK_SIGNING_TOKEN: "${GITLAB_WEBHOOK_SIGNING_TOKEN:-}"
      GITLAB_WEBHOOK_SECRET_TOKEN: "${GITLAB_WEBHOOK_SECRET_TOKEN:-}"
      GITLAB_INGESTION_PORT: "${GITLAB_INGESTION_PORT:-8083}"

  # EMBER-54. Backfill / reconciliation, same image. Holds the API token only.
  # One-off: `run --rm -T gitlab-backfill`; append `--lookback-hours 24` to reconcile.
  gitlab-backfill:
    profiles: ["gitlab-backfill"]
    build:
      context: ..
      dockerfile: services/gitlab-ingestion/Dockerfile
    image: ember-gitlab-ingestion
    entrypoint: ["python3", "pull.py"]
    environment:
      GITLAB_BASE_URL: "${GITLAB_BASE_URL:-https://gitlab.com}"
      GITLAB_API_TOKEN: "${GITLAB_API_TOKEN:-}"
      GITLAB_PROJECT: "${GITLAB_PROJECT:-}"
      GITLAB_PULL_CONCURRENCY: "${GITLAB_PULL_CONCURRENCY:-8}"

  # EMBER-51. The web app: sign-up, log-in, dashboard. Not part of the default `up`.
  # DATABASE_URL picks the database: file:/data/ember.db (SQLite, default) or
  # postgres://user:pass@host:5432/db (Postgres) with no other change.
  # BETTER_AUTH_SECRET is required: the server refuses to start without it.
  # It isn't marked required here (`:?`) so `docker compose config` works
  # without a .env, like the other services' secrets.
  web:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: ember-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-file:/data/ember.db}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
    volumes:
      - web-data:/data

  # EMBER-75. The cluster's Postgres major version (CloudNativePG 18.6). Not part of the default `up`.
  postgres:
    profiles: ["postgres"]
    image: postgres:18.6
    container_name: ember-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-locally}"
      POSTGRES_DB: ember
    volumes:
      - postgres-data:/var/lib/postgresql   # 18+ keeps PGDATA in a versioned subdirectory of this
    healthcheck:
      # TCP, not the socket: the first start runs initdb on a socket-only server
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ember", "-d", "ember"]
      interval: 5s
      timeout: 5s
      retries: 10

  # EMBER-75. Applies infra/k8s/apps/postgres/migrations with the dbmate the migrate Job runs, then exits.
  postgres-migrate:
    profiles: ["postgres"]
    image: ghcr.io/amacneil/dbmate:2.36.0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["--no-dump-schema", "--migrations-dir=/migrations", "up"]
    environment:
      DATABASE_URL: "postgres://ember:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/ember?sslmode=disable"
    volumes:
      - ./k8s/apps/postgres/migrations:/migrations:ro

  # EMBER-45. Not part of the default `up` (see profiles). Reads connector JSONL from
  # ./data/raw/<tenant>/ (or PIPELINE_INPUT, a path inside the container under /data) and writes
  # rejects to ./data/out/. Set PIPELINE_NEO4J_URI to the database to load into: bolt://neo4j:7687
  # for the compose Neo4j, or the cluster's bolt:// address together with that cluster's
  # PIPELINE_NEO4J_USER and PIPELINE_NEO4J_PASSWORD. The pipeline uses its own credentials, so the
  # cluster password never replaces NEO4J_PASSWORD, which still configures the compose Neo4j.
  # Arguments after the service name replace `command:` entirely, so pass the full list, e.g.
  # `... run --rm pipeline --tenant <tenant> --input /data/raw/<tenant> --rejects /data/out/rejects.jsonl --reset`.
  pipeline:
    profiles: ["pipeline"]
    build:
      context: ..
      dockerfile: services/pipeline/Dockerfile
    container_name: ember-pipeline
    environment:
      NEO4J_URI: "${PIPELINE_NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USER: "${PIPELINE_NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${PIPELINE_NEO4J_PASSWORD:-${NEO4J_PASSWORD:-change-me-locally}}"
    volumes:
      - ../data:/data
    command:
      - --tenant
      - "${EMBER_TENANT:-brandon-dev}"
      - --input
      - "${PIPELINE_INPUT:-/data/raw/${EMBER_TENANT:-brandon-dev}}"
      - --rejects
      - /data/out/rejects.jsonl

volumes:
  neo4j-data:
  neo4j-logs:
  embedding-models:
  slack-backfill-data:
  web-data:
  postgres-data:
