# In-cluster only: http://nginx.ember.svc.cluster.local
# The reverse proxy. Public traffic reaches it through the Funnel Ingress (ingress.yaml).
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: ember
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
