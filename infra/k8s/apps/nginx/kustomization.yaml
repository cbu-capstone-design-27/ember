apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# The name gets a content hash, so editing the config rolls the Deployment by itself.
configMapGenerator:
  - name: nginx-conf
    # Without this the ConfigMap lands in default and the Deployment's reference isn't rewritten.
    namespace: ember
    files:
      - default.conf.template
generatorOptions:
  # delete -k removes only the current hashed ConfigMap; the label finds the older ones.
  labels:
    ember.io/generated: "true"
