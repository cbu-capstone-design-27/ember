# Postgres, the ingestion store (docs/ingestion/architecture.md): one CloudNativePG instance, the
# Service that publishes it on every node's IP, and the Job that applies migrations/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ember
resources:
  - cluster.yaml
  - service-lb.yaml
  - migrate-job.yaml
# The migrate Job mounts these. The name gets a content hash, so adding a migration replaces the Job.
# List every new migration here; test_migrations.py fails on one that is missing.
configMapGenerator:
  - name: postgres-migrations
    files:
      - migrations/20261013000000_ingestion_schema.sql
      - migrations/20261013120000_raw_events_enrich_marker.sql
