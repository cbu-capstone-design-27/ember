# The chart version is pinned so a reinstall does not pick up a newer chart. Values: values.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 30m
  releaseName: headlamp
  chart:
    spec:
      chart: headlamp
      version: 0.45.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  valuesFrom:
    - kind: ConfigMap
      name: headlamp-values
