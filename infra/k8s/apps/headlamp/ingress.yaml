# Tailnet only: https://headlamp.tail470a31.ts.net. No tailscale.com/funnel annotation, so the name
# is never published outside the tailnet. Needs the Tailscale operator (infrastructure/).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: headlamp
      port:
        number: 80
  tls:
    - hosts:
        - headlamp
