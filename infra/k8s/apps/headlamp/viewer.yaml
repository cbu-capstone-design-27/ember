# The identity people sign in to Headlamp as. Read-only: the built-in view role, which Flux's
# flux-view-flux-system role extends to Flux's objects. view excludes Secrets.
# Get a sign-in token with make headlamp-token (valid 24 hours); no long-lived token is stored.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-viewer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: headlamp
---
# view covers namespaced objects only. Headlamp's cluster overview also lists nodes, persistent
# volumes and storage classes, and the Flux plugin looks up Flux's CRDs, so read those too.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-viewer-cluster
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-viewer-cluster
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: headlamp
