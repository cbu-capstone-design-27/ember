# The web app (apps/web, EMBER-112): sign-up, log-in, the dashboard, and the CLI's device sign-in.
# Tailnet only: https://<node>.<tailnet> for the whole team (tailscale serve on each node, in front
# of local-proxy.yaml; make web-serve), and ingress.yaml at https://ember-web.<tailnet> for devices
# the ember-web machine is shared with.
# Neither uses Funnel.
# One replica. Each start creates or updates the auth tables in schema web, and two pods starting
# together would race on that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ember
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  # Start the new pod and wait until it is ready before stopping the old one. Only the new pod runs
  # the table update, while the old one keeps serving
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Public on GHCR, so no imagePullSecret (docs/container-images.md). Pin a <branch>-<run>-<sha> tag
          image: ghcr.io/cbu-capstone-design-27/ember/web:develop-300-8a1799b
          env:
            # The pod stays in CreateContainerConfigError until every Secret not marked optional exists
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
            # Signs session cookies. Changing it signs everyone out, the CLI included
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: BETTER_AUTH_SECRET
            # Connect GitHub (EMBER-130): the ember-ingest App's OAuth client, which trades the code
            # GitHub sends back for a user token. Optional: until make web-secret writes them, Settings
            # says Connect GitHub isn't set up. The App's Callback URL is BETTER_AUTH_URL below +
            # /connect/github/callback
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: GITHUB_APP_CLIENT_ID
                  optional: true
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: GITHUB_APP_CLIENT_SECRET
                  optional: true
            # The Atlassian 3LO app's OAuth client, for Connect Jira (EMBER-131, apps/web/README.md). Without
            # them Settings says Connect Jira isn't set up. The app's callback URL is BETTER_AUTH_URL below +
            # /connect/jira/callback
            - name: JIRA_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: JIRA_OAUTH_CLIENT_ID
                  optional: true
            - name: JIRA_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: JIRA_OAUTH_CLIENT_SECRET
                  optional: true
            # The Slack app's OAuth client, for Connect Slack (EMBER-148, apps/web/README.md). Without them
            # Settings says Connect Slack isn't set up. The app's Redirect URL is BETTER_AUTH_URL below +
            # /connect/slack/callback
            - name: SLACK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: SLACK_CLIENT_ID
                  optional: true
            - name: SLACK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: SLACK_CLIENT_SECRET
                  optional: true
            # Where the webhooks Connect Jira registers send to: intake, through the public Funnel address
            - name: JIRA_WEBHOOK_URL
              value: https://ember.tail470a31.ts.net/webhook/jira
            # Seal the credentials an owner connects a source with into source_credentials (EMBER-147,
            # ADR 0010). The web app holds both kinds; enrich gets only api, intake only webhook. From
            # k8s/apps/source-credentials (make source-credentials-secret). The pod waits until both exist
            - name: SOURCE_CREDENTIALS_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: source-credentials-api
                  key: SOURCE_CREDENTIALS_API_KEYS
            - name: SOURCE_CREDENTIALS_WEBHOOK_KEYS
              valueFrom:
                secretKeyRef:
                  name: source-credentials-webhook
                  key: SOURCE_CREDENTIALS_WEBHOOK_KEYS
            # The main address. The CLI's device sign-in sends people to <this>/device, so it is a
            # node address everyone can reach. pi-cp, because the cluster is down whenever it is.
            # HTTPS, so session cookies are Secure, and sign-in only works on the https addresses
            - name: BETTER_AUTH_URL
              value: https://pi-cp.tail470a31.ts.net
            # Every other address a browser may send as Origin. Better Auth refuses a sign-in from an
            # origin missing here, with 403 "Invalid origin". The other nodes (make web-serve), and
            # ember-web (ingress.yaml)
            - name: BETTER_AUTH_TRUSTED_ORIGINS
              value: >-
                https://hv-worker-1.tail470a31.ts.net,https://hv-worker-2.tail470a31.ts.net,https://ember-web.tail470a31.ts.net
          ports:
            - name: http
              containerPort: 3000
          # Better Auth's /ok answers without the database. The pages need it, but a Postgres outage
          # should show as errors, not as a pod restarting in a loop
          readinessProbe:
            httpGet:
              path: /api/auth/ok
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/auth/ok
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # The table update runs before the server listens
          startupProbe:
            httpGet:
              path: /api/auth/ok
              port: http
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Next.js writes its cache under .next/cache. /data is the image's SQLite directory, unused
          # with Postgres
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
