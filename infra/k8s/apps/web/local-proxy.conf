# web-local (local-proxy.yaml): passes TCP from 127.0.0.1:3001 on each node to Service web. tailscale
# serve on the node (make web-serve) proxies https://<node>.<tailnet> here. It can't proxy to the
# Service itself: tailscaled marks its own connections, and those don't reach a pod on another node.
# A connection to 127.0.0.1 isn't marked, and this process's own are ordinary.
# Plain TCP, so the X-Forwarded-For that tailscale serve sets reaches the app as it was.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    server {
        # Loopback only: nothing off the node reaches it, the LAN included
        listen 127.0.0.1:3001;
        # Resolved once at start through cluster DNS. A ClusterIP stays fixed while the Service exists
        proxy_pass web.ember.svc.cluster.local:3000;
        proxy_connect_timeout 5s;
    }
}
