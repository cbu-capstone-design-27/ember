# enrich:slack (EMBER-67, services/slack-ingestion/enrich.py): turns Slack rows in raw_events into
# source_records. It serves nothing, so there is no Service and no probe. It claims rows with
# FOR UPDATE SKIP LOCKED, so a second replica or a rollout's overlap never enriches a row twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrich-slack
  namespace: ember
  labels:
    app: enrich-slack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enrich-slack
  template:
    metadata:
      labels:
        app: enrich-slack
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # SIGTERM stops claiming and finishes the rows in flight. A row stuck behind a Slack rate limit
      # for more than 10 s more rolls back instead, so this fits; a row cut off is claimed again
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enrich
          # Public on GHCR, so no imagePullSecret (docs/container-images.md). Pin a <branch>-<run>-<sha> tag
          image: ghcr.io/cbu-capstone-design-27/ember/slack-ingestion:develop-198-5545f76
          # The image's default command is the stdout-only receiver.py; intake receives Slack's events
          command: ["python3", "enrich.py"]
          env:
            # The pod stays in CreateContainerConfigError until both Secrets exist
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
            # Secret enrich-slack-bot (slack-bot.sops.yaml): the Bot User OAuth Token, for lookups
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: enrich-slack-bot
                  key: SLACK_BOT_TOKEN
            # The Slack app is one the workspace created itself, so Slack's normal tiers apply
            - name: SLACK_RATE_MODE
              value: internal
            - name: CONCURRENCY
              value: "4"
          # Idle it holds a LISTEN connection and a small pool, plus one thread per runner for Slack calls
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
