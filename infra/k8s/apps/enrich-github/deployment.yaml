# enrich:github (EMBER-65, services/github-ingestion/enrich.py): turns GitHub rows in raw_events into
# source_records. It serves nothing, so there is no Service and no probe. It claims rows with
# FOR UPDATE SKIP LOCKED, so a second replica or a rollout's overlap never enriches a row twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrich-github
  namespace: ember
  labels:
    app: enrich-github
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enrich-github
  template:
    metadata:
      labels:
        app: enrich-github
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # SIGTERM stops claiming and finishes the rows in flight. A row can wait on GitHub's rate limit,
      # so give it longer than intake's requests; a row cut off is rolled back and claimed again
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        # Lets nobody read the App key in the Secret volume (mode 0440)
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enrich
          # Public on GHCR, so no imagePullSecret (docs/container-images.md). Pin a <branch>-<run>-<sha> tag
          image: ghcr.io/cbu-capstone-design-27/ember/github-ingestion:develop-150-b918508
          env:
            # The pod stays in CreateContainerConfigError until postgres-app exists
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
            # ember-ingest. Not a secret (services/github-ingestion/README.md, Credentials)
            - name: GITHUB_APP_ID
              value: "5075660"
            # A file, so the worker never writes the key to a temp file on the read-only root
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /etc/github-app/private-key.pem
            - name: CONCURRENCY
              value: "4"
          volumeMounts:
            - name: github-app
              mountPath: /etc/github-app
              readOnly: true
          # Idle it holds a LISTEN connection and a small pool. Large pushes page through commits
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        # Secret enrich-github-app (github-app.sops.yaml): the App's private key
        - name: github-app
          secret:
            secretName: enrich-github-app
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
