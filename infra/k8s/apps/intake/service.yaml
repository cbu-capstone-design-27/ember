# In-cluster only: http://intake.ember.svc.cluster.local:8080
# What nginx proxies /webhook/ to. Its /health and /metrics are not routed publicly.
apiVersion: v1
kind: Service
metadata:
  name: intake
  namespace: ember
spec:
  selector:
    app: intake
  ports:
    - name: http
      port: 8080
      targetPort: http
