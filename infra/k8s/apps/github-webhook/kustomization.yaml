apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
# The placeholder's code. The name gets a content hash, so editing listener.py rolls the Deployment.
configMapGenerator:
  - name: github-webhook-placeholder
    # Without this the ConfigMap lands in default and the Deployment's reference isn't rewritten.
    namespace: ember
    files:
      - listener.py
