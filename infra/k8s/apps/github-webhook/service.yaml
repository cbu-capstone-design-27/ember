# In-cluster only: http://github-webhook.ember.svc.cluster.local:8080
# The stable name nginx proxies /webhook/github to. Whatever runs behind it can change; this can't.
apiVersion: v1
kind: Service
metadata:
  name: github-webhook
  namespace: ember
spec:
  selector:
    app: github-webhook
  ports:
    - name: http
      port: 8080
      targetPort: http
