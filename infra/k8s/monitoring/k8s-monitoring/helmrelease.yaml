# The chart version is pinned so a reinstall does not pick up a newer chart. Values: values.yaml.
# The chart installs the Alloy operator, which runs the collectors from its Alloy objects.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
spec:
  interval: 30m
  releaseName: k8s-monitoring
  chart:
    spec:
      chart: k8s-monitoring
      version: 4.5.3
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: k8s-monitoring-values
