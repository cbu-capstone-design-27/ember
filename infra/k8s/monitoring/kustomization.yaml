# Monitoring (EMBER-91): the collector that sends the cluster's metrics, logs and events to Grafana
# Cloud, and the dashboard the Grafana Operator keeps there. Flux applies this as its own
# Kustomization, monitoring (clusters/homelab/monitoring.yaml), so a broken collector never holds up
# apps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - helmrepository.yaml
  - k8s-monitoring
  - grafana
