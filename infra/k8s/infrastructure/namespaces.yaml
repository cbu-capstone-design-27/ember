# prune: disabled keeps Flux from deleting a namespace, and everything in it (Neo4j's data claim
# included), if it is ever dropped from this file. Delete one by hand if that is really meant.
apiVersion: v1
kind: Namespace
metadata:
  name: ember
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# EMBER-64, step 1 of 2: no prune annotation, so the next change can drop this Namespace and Flux
# deletes it (ADR 0009). Remove this block once Flux has applied this one.
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
