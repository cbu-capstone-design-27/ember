# CloudNativePG operator: runs the Postgres in apps/postgres from its Cluster object (ADR 0005).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system
resources:
  - helmrepository.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: cnpg-values
    files:
      - values.yaml
configurations:
  - kustomizeconfig.yaml
