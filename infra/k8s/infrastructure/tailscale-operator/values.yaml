# Values for the Tailscale Kubernetes operator chart (tailscale/tailscale-operator). Flux installs it
# from helmrelease.yaml, which pins the chart version.
# No credentials here: Secret operator-oauth (operator-oauth.sops.yaml, SOPS-encrypted) holds them,
# and the chart mounts it because oauth.clientId is left empty.
operatorConfig:
  # The operator's own device name on the tailnet
  hostname: homelab-operator
  defaultTags:
    - tag:k8s-operator

# Every proxy the operator creates (one per Tailscale Ingress) joins the tailnet with this tag.
# Funnel needs the "funnel" nodeAttr on it in the tailnet policy.
proxyConfig:
  defaultTags: tag:k8s
