# Tailscale Kubernetes operator: serves ingressClassName tailscale (k8s/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailscale
resources:
  - helmrepository.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: tailscale-operator-values
    files:
      - values.yaml
configurations:
  - kustomizeconfig.yaml
