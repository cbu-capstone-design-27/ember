# The chart version is pinned so a reinstall does not pick up a newer chart. Values: values.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  interval: 30m
  releaseName: tailscale-operator
  chart:
    spec:
      chart: tailscale-operator
      version: 1.102.4
      sourceRef:
        kind: HelmRepository
        name: tailscale
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: tailscale-operator-values
